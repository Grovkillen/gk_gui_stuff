# config/registrations.yml: vad pluginet lägger i de gemensamma lagren.
# Tomma listor betyder ingenting där; nycklarna
# får inte saknas. En kontrollerad utskrift av det koden registrerar:
# init.rb och extensions/gk_gui_stuff/ är källan, och varje rad pekar
# på något som finns. Det som bara är planerat står inte här
# förrän det är byggt.
permissions: []
menu:                   # rader i trepunktsmenyn (GkGuiStuff::Menu.register i init.rb)
  - {key: history, section: show, context: [issue], label: gk_gui_stuff_menu_history, kind: action}
  - {key: fullscreen, section: show, context: [issue, issue_list, project, wiki_page, version, other], label: gk_gui_stuff_menu_fullscreen, kind: action}
  - {key: collapse_all, section: show, context: [issue], label: gk_gui_stuff_sec_close_all, kind: action, placement: out}
drawer: []
notices: []
banners:
  - {key: login_warning, level: notice, contexts: [any], condition: anonymous, animation: setting}   # desktop under toppmenyn, telefon i utfällda menyn
waves:                  # vågens ord för core:s formulär som inte sparar (GkGuiStuff::WaveForms); spara och ta bort säger vågen själv
  - {key: save, word: gk_gui_stuff_wave_saving, done: gk_gui_stuff_wave_saved}
  - {key: delete, word: gk_gui_stuff_wave_deleting, done: gk_gui_stuff_wave_deleted}
  - {key: login, match: '/login(\?|$)', word: gk_gui_stuff_wave_logging_in, done: gk_gui_stuff_wave_logged_in}
  - {key: account_mail, match: '/account/(lost_password|register|activation_email)', word: gk_gui_stuff_wave_sending, done: gk_gui_stuff_wave_sent}
  - {key: test_email, match: '/admin/test_email', word: gk_gui_stuff_wave_sending, done: gk_gui_stuff_wave_sent}
  - {key: default_configuration, match: '/admin/default_configuration', word: gk_gui_stuff_wave_reading_in, done: gk_gui_stuff_wave_read_in}
  - {key: imports, match: '/imports(/|$)', word: gk_gui_stuff_wave_importing, done: gk_gui_stuff_wave_imported}
surfaces: []
color_roles:            # theme_engine and the palette give the colour (--gk-role-<group>-<key>)
  - {key: parent_row, group: ui, label: label_gk_gui_stuff_mod_parent_link}   # parent_link: the parent issue's row in the box of related issues
  # the primitives' roles (gk_gui_stuff_primitives.css), declared on :where(:root) until theme_engine's palette takes them; the
  # categories and the alert levels have -soft for a background, critical's being the alarm's
  - {key: "1", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "2", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "3", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "4", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "5", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "6", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "7", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "8", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "9", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "10", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "11", group: category, label: label_gk_gui_stuff_role_category}
  - {key: "12", group: category, label: label_gk_gui_stuff_role_category}
  - {key: tip, group: alert, label: label_gk_gui_stuff_role_alert_tip}
  - {key: info, group: alert, label: label_gk_gui_stuff_role_alert_info}
  - {key: notice, group: alert, label: label_gk_gui_stuff_role_alert_notice}
  - {key: warning, group: alert, label: label_gk_gui_stuff_role_alert_warning}
  - {key: alarm, group: alert, label: label_gk_gui_stuff_role_alert_alarm}
  - {key: critical, group: alert, label: label_gk_gui_stuff_role_alert_critical}   # the alarm filled, white text on it
  - {key: alarm-on-dark, group: alert, label: label_gk_gui_stuff_role_alert_alarm_on_dark}   # the alarm mixed lighter for core's dark menus; no -soft
  - {key: alarm-row, group: alert, label: label_gk_gui_stuff_role_alert_alarm_row}   # the ground of a table row with an error, a step lighter than the alarm's soft tone; no -soft
  - {key: admin, group: ui, label: label_gk_gui_stuff_role_admin}         # what only administrators see
  - {key: admin-on-dark, group: ui, label: label_gk_gui_stuff_role_admin_on_dark}   # the admin role mixed lighter for core's dark menus; no -soft
  - {key: muted, group: ui, label: label_gk_gui_stuff_role_muted}
  - {key: muted-fill, group: ui, label: label_gk_gui_stuff_role_muted_fill}   # a muted surface with white text (the top band); no -soft
  # the neutral interface; no -soft except code (the chip's background); shadow is the base colour each rule mixes
  - {key: surface, group: ui, label: label_gk_gui_stuff_role_surface}
  - {key: frame, group: ui, label: label_gk_gui_stuff_role_frame}        # around boxes, fold-out boxes and fields
  - {key: divider, group: ui, label: label_gk_gui_stuff_role_divider}
  - {key: shadow, group: ui, label: label_gk_gui_stuff_role_shadow}
  - {key: code, group: ui, label: label_gk_gui_stuff_role_code}
  - {key: possible, group: ui, label: label_gk_gui_stuff_role_possible}      # the dashed pill: possible, not chosen
  - {key: effect, group: ui, label: label_gk_gui_stuff_role_effect}          # where a change shows (the marker, the flags new, changed, gone); with -soft, info by default
  - {key: text, group: ui, label: label_gk_gui_stuff_role_text}              # the body text; its -soft is the secondary text (a hint, a sub-line), a tone of text and never a background
  - {key: raised, group: ui, label: label_gk_gui_stuff_role_raised}          # a ground a step off the surface (a quiet row, a button under the pointer); no -soft
  - {key: link, group: ui, label: label_gk_gui_stuff_role_link}              # a link inside the instance; no -soft
  - {key: on-fill, group: ui, label: label_gk_gui_stuff_role_on_fill}        # text and marks on a filled role, white by default; no -soft
  - {key: canvas, group: ui, label: label_gk_gui_stuff_role_canvas}          # the squares of the chequered ground under an example; no -soft
  - {key: neutral, group: ui, label: label_gk_gui_stuff_role_neutral}            # a primitive that has no role or category (a chosen pill's fill, the dot, the ring, a bar); with -soft, the ground under it
  - {key: added, group: diff, label: label_gk_gui_stuff_role_diff_added}     # what a diff added, as text on its -soft ground
  - {key: removed, group: diff, label: label_gk_gui_stuff_role_diff_removed} # what a diff took away, as text on its -soft ground
  - {key: direct, group: save, label: label_gk_gui_stuff_role_save_direct}
  - {key: changed, group: save, label: label_gk_gui_stuff_role_save_changed}
  - {key: saved, group: save, label: label_gk_gui_stuff_role_save_saved}
  - {key: saved-strong, group: save, label: label_gk_gui_stuff_role_save_saved_strong}   # the saved green as text and as a fill under white (the pill role saved); no -soft
  - {key: failed, group: save, label: label_gk_gui_stuff_role_save_failed}
  # the line's bands and the line, the chosen and the logic; gk_gui_stuff_primitives.css. No -soft,
  # except ui choice; the line's now-soft and next-soft are keys of their own
  - {key: incoming, group: band, label: label_gk_gui_stuff_role_band_incoming}
  - {key: active, group: band, label: label_gk_gui_stuff_role_band_active}
  - {key: settled, group: band, label: label_gk_gui_stuff_role_band_settled}
  - {key: closed, group: band, label: label_gk_gui_stuff_role_band_closed}
  - {key: archived, group: band, label: label_gk_gui_stuff_role_band_archived}
  # a band's line: the edge a step has in its band's colour, a line with no text on it; it follows its band in the
  # light and has a clearer value of its own where the tone is dark. No -soft
  - {key: incoming-line, group: band, label: label_gk_gui_stuff_role_band_incoming_line}
  - {key: active-line, group: band, label: label_gk_gui_stuff_role_band_active_line}
  - {key: settled-line, group: band, label: label_gk_gui_stuff_role_band_settled_line}
  - {key: closed-line, group: band, label: label_gk_gui_stuff_role_band_closed_line}
  - {key: archived-line, group: band, label: label_gk_gui_stuff_role_band_archived_line}
  - {key: done, group: line, label: label_gk_gui_stuff_role_line_done}
  - {key: now, group: line, label: label_gk_gui_stuff_role_line_now}
  - {key: now-soft, group: line, label: label_gk_gui_stuff_role_line_now_soft}
  - {key: next, group: line, label: label_gk_gui_stuff_role_line_next}
  - {key: next-soft, group: line, label: label_gk_gui_stuff_role_line_next_soft}
  - {key: expected, group: line, label: label_gk_gui_stuff_role_line_expected}
  - {key: stroke, group: line, label: label_gk_gui_stuff_role_line_stroke}
  - {key: track, group: line, label: label_gk_gui_stuff_role_line_track}
  - {key: choice, group: ui, label: label_gk_gui_stuff_role_choice}        # has -soft
  - {key: and, group: logic, label: label_gk_gui_stuff_role_logic_and}
  - {key: or, group: logic, label: label_gk_gui_stuff_role_logic_or}
  - {key: not, group: logic, label: label_gk_gui_stuff_role_logic_not}
  - {key: external, group: link, label: label_gk_gui_stuff_role_link_external}   # has -soft; a link out of the instance
personal: []
features:               # records Features.register (init.rb); default: true only where a decision says so
  - {key: gui_stuff.styleguide, label: label_gk_feature_gui_stuff_styleguide, help: text_gk_feature_gui_stuff_styleguide}
reasons:                # records Reasons.register (init.rb)
  - {key: gui_stuff.feature_switch, default: optional, admin: true, label: label_gk_reason_gui_stuff_feature_switch}
  - {key: gui_stuff.meaning, default: optional, admin: true, label: label_gk_reason_gui_stuff_meaning}   # the modes under Administration, Meaning view and Classic view
  - {key: gui_stuff.appearance, default: optional, admin: true, label: label_gk_reason_gui_stuff_appearance}   # the form under Administration, Appearance
meaning: []             # GkGuiStuff::Meaning: no page types of its own; the page owner registers them
appearance_settings:    # records AppearanceSettings (GkGuiStuff::Appearance.declare!, appearance.rb): every module but actions_menu, the settings that are not modules, the shared values and a setting per core page type of the Meaning register (none registered today); off from the start
  - {key: gui_stuff.account_menu, group: instance, modes: ["off", forced], default: "off", proposal: forced, values: [], label: label_gk_gui_stuff_mod_account_menu}
  - {key: gui_stuff.branch_jump, group: instance, modes: ["off", optional, forced], default: "off", proposal: "off", values: [], label: label_gk_gui_stuff_mod_branch_jump}
