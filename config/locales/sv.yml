  text_gk_gui_stuff_sg_show_where: "När något kommer upp utanför fönstret står en pil i fönstrets kant mot det, med ett ord om vad som kom upp. Vyn flyttas aldrig av sig själv. Ett klick rullar dit, målet får en ring som pulserar två gånger, och Tillbaka står i nederkanten tills den används eller du rullar själv. Pilen försvinner när målet syns och efter 20 sekunder. Flera pilar åt samma håll staplas och täcker inte varandra. Exemplen är påhittade: målen står i en egen ruta som rullar, pilarna i det riktiga fönstret, och inget sparas."
