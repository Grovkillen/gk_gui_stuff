  text_gk_gui_stuff_sg_use_flag: "Det som säger något om det den sitter på och inte gör något. Främst det som är nytt, ändrat eller borta, som försvinner när personen sett det. Där administratörer ställer in (Utseende, Funktioner, Ikonbiblioteket, stilguiden och pluginens inställningar) också ett fast läge: aktiv, avstängd, saknas, bara admin."
