  # Förhandsvisningen av externa länkar och länkarna till andra webbplatser
  label_gk_gui_stuff_mod_link_preview_external: "Förhandsvisning av externa länkar"
  text_gk_gui_stuff_mod_link_preview_external: "En förhandsvisning med rubrik, beskrivning och bild för länkar till andra webbplatser. Servern hämtar sidan i bakgrunden, bara från domänerna i listan, och som förval bara för länkar som skrivs med makrot {{gk_link_preview(adress)}}. Bilden visas från instansen. En läsare som inte är inloggad får aldrig en extern förhandsvisning, så att en anonym läsare aldrig får servern att hämta något utifrån."
  label_gk_gui_stuff_mod_external_new_tab: "Öppna externa länkar i ny flik"
  text_gk_gui_stuff_mod_external_new_tab: "En länk till en annan webbplats öppnas i en ny flik, i en text och överallt där den har utseendet för externa länkar (egna fält, projektets hemsida, GK People och GK Icons). Tipset och skärmläsaren säger det. Var och en väljer själv under Mitt konto, Utseende; av från början."
  label_gk_gui_stuff_warning: "Varning"
  text_gk_gui_stuff_lpe_warning: "För att visa förhandsvisningen hämtar servern den externa sidan. Den externa webbplatsen ser då att länken finns här och när den lästes in, och en sida kan göras så att den räknar eller känner igen hämtningarna, trots att ingen har klickat. Bilder sparas därför på servern, så att den som läser aldrig kontaktar webbplatsen. Slå bara på för webbplatser ni litar på."
  text_gk_gui_stuff_lpe_warning_all: "Med * i listan hämtar servern från varje webbplats som någon länkar till. Den som kan skriva en länk kan då få servern att kontakta vilken webbplats som helst, och den webbplatsen kan räkna eller känna igen hämtningarna trots att ingen har klickat. Ett skäl krävs för att spara."
  text_gk_gui_stuff_person_only: "Bara per person"
  text_gk_gui_stuff_person_only_tip: "Den här inställningen tvingas aldrig fram för alla; var och en väljer själv."
  label_gk_gui_stuff_lpe_domains: "Hämta bara från"
  text_gk_gui_stuff_lpe_domains: "en domän per rad"
  text_gk_gui_stuff_lpe_domains_info: "*.example.se betyder alla underdomäner till example.se, men inte example.se själv (skriv den på en egen rad); en rad med bara * tillåter alla webbplatser. Skriv domäner med å, ä eller ö i punycode (xn--). Interna adresser hämtas aldrig."
  label_gk_gui_stuff_lpe_bare_links: "Även för nakna länkar"
  text_gk_gui_stuff_lpe_bare_links_info: "Av: förhandsvisningen kommer bara för länkar som skrivs med makrot. På: också för nakna länkar, alltså vanliga länkar i text, till domänerna i listan."
  label_gk_gui_stuff_lpe_max_parallel: "Hämtningar samtidigt"
  text_gk_gui_stuff_lpe_max_parallel: "högst, i hela instansen"
  label_gk_gui_stuff_lpe_domain_interval_seconds: "Väntan mellan hämtningar från samma domän"
  text_gk_gui_stuff_lpe_domain_interval_seconds: "sekunder"
  label_gk_gui_stuff_lpe_page_max_kb: "Största sida"
  text_gk_gui_stuff_lpe_page_max_kb: "kB"
  label_gk_gui_stuff_lpe_image_max_kb: "Största bild"
  text_gk_gui_stuff_lpe_image_max_kb: "kB"
  label_gk_gui_stuff_lpe_timeout_seconds: "Längsta väntan på svar"
  text_gk_gui_stuff_lpe_timeout_seconds: "sekunder"
  label_gk_gui_stuff_lpe_queue_max: "Högst i kön"
  text_gk_gui_stuff_lpe_queue_max: "adresser"
  text_gk_gui_stuff_lpe_queue_max_info: "När kön är full visas länken som vanligt, utan förhandsvisning, tills kön har krympt. En person kan lägga till högst 60 nya adresser i timmen; det räknas i Rails cache och räknas inte när cachen inte sparar något (null_store, vanligt i development), men taket för alla förhandsvisningar, tio gånger kön och minst 1000, gäller ändå."
  label_gk_gui_stuff_lpe_refresh_days: "Förnya en förhandsvisning som visas efter"
  text_gk_gui_stuff_lpe_refresh_days: "dagar"
  label_gk_gui_stuff_lpe_forget_days: "Ta bort en förhandsvisning som ingen har visat på"
  text_gk_gui_stuff_lpe_forget_days: "dagar"
  label_gk_gui_stuff_lpe_link_previews_dir: "Mapp för bilderna"
  text_gk_gui_stuff_lpe_link_previews_dir_info: "Tom betyder gk/gui_stuff/link_previews i mappen för bilagor. Bilderna följer aldrig med i en export. En ny mapp gäller för nya bilder; de gamla flyttas inte."
  label_gk_gui_stuff_lpe_image_folder_max_mb: "Högsta storlek för bilderna tillsammans"
  text_gk_gui_stuff_lpe_image_folder_max_mb: "MB"
  text_gk_gui_stuff_lpe_image_folder_max_mb_info: "När bilderna tillsammans når den här storleken tas bilden bort från de förhandsvisningar som visades längst sedan, tills resten ryms. Förhandsvisningen står kvar med rubrik och text, som en förhandsvisning utan bild, och bilden hämtas igen när förhandsvisningen förnyas. Det prövas varje gång en bild sparas och i gallringen varje natt."
  label_gk_gui_stuff_lpe_clear: "Töm förhandsvisningarna"
  text_gk_gui_stuff_lpe_clear_confirm: "Alla sparade förhandsvisningar och bilder tas bort. De hämtas igen när länkarna visas."
  text_gk_gui_stuff_lpe_cleared: "Förhandsvisningarna är tömda (%{count})."
  text_gk_gui_stuff_lpe_clear_question: "Ta bort alla sparade förhandsvisningar och bilder?"
  text_gk_gui_stuff_lpe_clear_what: "%{count} adresser med förhandsvisning, i kön eller misslyckade, och bilder på %{size}. Det går inte att ångra. Förhandsvisningarna hämtas igen när någon visar länken."
