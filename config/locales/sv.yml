  label_gk_gui_stuff_beat_seconds: "Sekunder:"
  label_gk_gui_stuff_wave_opacity_pct: "Vågens bakgrund (procent)"
  text_gk_gui_stuff_wave_opacity_pct: "Hur tät färgen bakom ordet är. 0: bara ordet."
  label_gk_gui_stuff_wave_first_ms: "Vågens tid de första tio gångerna (ms)"
  text_gk_gui_stuff_wave_first_ms: "Den som är ny ser vad som hände."
  label_gk_gui_stuff_wave_ms: "Vågens tid därefter (ms)"
  text_gk_gui_stuff_wave_ms: "Den som är van ser bara vågen gå förbi."
  label_gk_gui_stuff_loading_delay_ms: "LADDAR visas efter (ms)"
  text_gk_gui_stuff_loading_delay_ms: "Bara när nästa sida dröjer."
  label_gk_gui_stuff_notice_seconds: "Sekunder:"
  label_gk_gui_stuff_corner_max_entries: "Hörnvikets kort: högst så många rader"
  text_gk_gui_stuff_corner_max_entries: "Resten räknas som och N till."
  label_gk_gui_stuff_wave_hide_flash: "Dölj Redmines gröna ruta när vågen visats"
  text_gk_gui_stuff_wave_hide_flash: "Vågen säger då det rutan sa, och rutan visas inte. Av: båda visas. Utan vågen (modulen av, för alla eller för en användare) visas rutan alltid, med nedräkning och kryss om den modulen är på."
  label_gk_gui_stuff_declutter: "Dolt"
  text_gk_gui_stuff_declutter: "Det som kryssas i döljs för alla. Att dölja är aldrig behörighet: det som inte får göras är en roll eller en regel."
  label_gk_gui_stuff_dc_top_help: "Toppmeny: Hjälp"
  label_gk_gui_stuff_dc_footer_powered: "Sidfot: Powered by Redmine"
  label_gk_gui_stuff_dc_issue_log_time: "Ärendesida: Stämpla tid"
  label_gk_gui_stuff_dc_issue_copy: "Ärendesida: Kopiera"
  label_gk_gui_stuff_dc_sidebar_watchers: "Sidofält: Bevakare"
  label_gk_gui_stuff_dc_form_estimated_hours: "Formulär: Beräknad tid"
  label_gk_gui_stuff_dc_form_done_ratio: "Formulär: % Klart"
  label_gk_gui_stuff_mod_recent_pages: "Senast besökta"
  text_gk_gui_stuff_mod_recent_pages: "En lista i toppmenyn med sidorna du senast var på. Sparas bara i den här webbläsaren."
  label_gk_gui_stuff_mod_wave: "Våg vid sparat och laddar"
  text_gk_gui_stuff_mod_wave: "Ett ord över hela sidan som kommer och går: SPARAR när ett formulär skickas, SPARAT när sidan kommer tillbaka, LADDAR när nästa sida dröjer. Tar aldrig pekaren; ett klick eller en tangent tar bort den."
  label_gk_gui_stuff_mod_corner: "Hörnvik när ärendet ändrats"
  text_gk_gui_stuff_mod_corner: "Ett vik i ärendesidans hörn när någon ändrat ärendet sedan du öppnade det, med vem, när och vad. Kräver hjärtslaget."
  label_gk_gui_stuff_mod_outcome_notice: "Notis med utfallet efter sparande"
  text_gk_gui_stuff_mod_outcome_notice: "När ett formulär skickats säger en notis nere till höger hur det gick: ordet och Redmines text en kort stund, ett fel tills notisen stängs. Redmines egen ruta står kvar. Medan vågen är på säger vågen utfallet i stället. Av: bara Redmines ruta."
  label_gk_gui_stuff_mod_history_navigator: "Snabbhopp i ärendets historik"
  text_gk_gui_stuff_mod_history_navigator: "g öppnar en lista över ärendets anteckningar att söka och hoppa i; j och k går till nästa och föregående anteckning."
  label_gk_gui_stuff_mod_actions_menu: "Rader i trepunktsmenyn"
  text_gk_gui_stuff_mod_actions_menu: "Plugin lägger sina rader i Redmines trepunktsmeny, i avdelningar, i stället för egna knappar."
  label_gk_gui_stuff_mod_fullscreen: "Bara innehållet"
  text_gk_gui_stuff_mod_fullscreen: "Raden Bara innehållet i trepunktsmenyn (…) på ärendet, ärendelistan, projektet, wikisidan och versionen döljer menyer, huvud och sidofält. Valet följer med dig mellan datorer. Esc går tillbaka."
  label_gk_gui_stuff_mod_branch_jump: "Hopp i projektgrenen"
  text_gk_gui_stuff_mod_branch_jump: "Tecknet » vid projektnamnet visar förälder, syskon och barn i projektträdet, med antal öppna ärenden, och hoppet behåller fliken du står i."
  label_gk_gui_stuff_mod_declutter: "Dolt"
  text_gk_gui_stuff_mod_declutter: "Döljer det som kryssats i under Dolt, för alla."
