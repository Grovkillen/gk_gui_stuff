sv:
  text_gk_gui_stuff_compat_missing: "GK Compat saknas. Sidorna, menyerna och API:t i GK GUI Stuff är inte aktiva utan det. Skydd och spår gäller ändå."
  text_gk_gui_stuff_compat_required: "Den installerade GK Compat är för gammal. %{version} eller senare krävs. Sidorna, menyerna och API:t i GK GUI Stuff är inte aktiva utan det. Skydd och spår gäller ändå."
  label_gk_gui_stuff_about: "Om pluginet"
  label_gk_gui_stuff_changelog: "Ändringslogg"
  text_gk_gui_stuff_changelog_english: "Ändringsloggen skrivs alltid på engelska."
  text_gk_gui_stuff_description: "Samling av små, avstängbara UI-moduler"
  label_gk_gui_stuff_user_core_like: "Var och en får välja Som Redmine för mig"
  text_gk_gui_stuff_user_core_like: "Raden Som Redmine för mig under Mitt konto, Utseende stänger alla valfria utseendeinställningar för personen, utan att ändra personens val."
  label_gk_gui_stuff_settings_own: "Pluginets inställningar"
  label_gk_gui_stuff_preview_delay: "Förhandsvisningen visas efter (ms)"
  label_gk_gui_stuff_mod_link_preview: "Förhandsvisning av interna länkar"
  text_gk_gui_stuff_mod_link_preview: "En förhandsvisning med det viktigaste om ett ärende, en person eller en grupp när pekaren vilar på länken. Alt och nedpil öppnar den från tangentbordet, Esc stänger. Hur länge pekaren ska vila ställs in under raden (förvalt 500 ms)."
  label_gk_gui_stuff_mod_openers: "Öppna i panel eller helskärm"
  text_gk_gui_stuff_mod_openers: "En knapp som ett fält visar (till exempel en karta) öppnar innehållet i en panel eller över hela skärmen. Stäng och Esc stänger, och fokus går tillbaka till knappen. Utan modulen visas fältets textversion. Knapparna kommer från andra GK-tillägg, i dag fältens utseenden i GK Fields och kartorna i GK GIS; utan något av dem finns inget här att prova."
  label_gk_gui_stuff_my: "Utseende"
  label_gk_gui_stuff_event_choice_changed: "Eget val ändrat (utseende och hjälpmedel)"
  label_gk_gui_stuff_event_meaning_changed: "Meningsvy och Klassisk vy ändrad"
  text_gk_gui_stuff_and_more: "och %{count} till"
  button_gk_gui_stuff_open: "Öppna"
  label_gk_gui_stuff_mod_members_by_group: "Medlemmar via grupp visas som gruppen"
  text_gk_gui_stuff_mod_members_by_group: "I projektets ruta Medlemmar visas bara de som lagts till direkt. Den som är medlem genom en grupp visas inte för sig: gruppen står där med sin roll, och förhandsvisningen av gruppen säger vilka som ingår."
  label_gk_gui_stuff_mod_report_clarity: "Tydligare rapporttabell"
  text_gk_gui_stuff_mod_report_clarity: "Rapporten Ärenden per ... skiljer på statusar, summorna Öppna och Stängda (med vilka statusar som ingår) och Totalt, och varje diagram får en rubrik och en rad om vad det visar."
  label_gk_gui_stuff_rep_group_status: "Status"
  label_gk_gui_stuff_rep_group_sum: "Summa per läge"
  label_gk_gui_stuff_rep_group_total: "Alla"
  label_gk_gui_stuff_rep_closed_status: "stängd status"
  label_gk_gui_stuff_rep_total_note: "= öppna + stängda"
  label_gk_gui_stuff_rep_chart_by_row: "En stapel per rad i tabellen, uppdelad på status. Stängda statusar är dolda från början. Klicka på en status i förklaringen för att visa eller dölja den."
  label_gk_gui_stuff_rep_chart_by_status: "En stapel per status, uppdelad på raderna i tabellen. Klicka på ett namn i förklaringen för att visa eller dölja det."
  label_gk_gui_stuff_values: "Värden"
  label_gk_gui_stuff_fold_height: "Höjd:"
  text_gk_gui_stuff_fold_height: "px"
  label_gk_gui_stuff_fold_attachments: "Visa högst så många bilagor"
  label_gk_gui_stuff_attachments_newest: "Nyaste bilagan först"
  text_gk_gui_stuff_attachments_newest: "Ärendets bilagor står med den nyaste överst i stället för Redmines ordning, äldst först. Gäller med modulen Många bilagor visas kort på, och den korta listan visar då de nyaste."
  label_gk_gui_stuff_footer_text: "Sidfotens text"
  text_gk_gui_stuff_footer_text: "En egen rad längst ner på varje sida, under Redmines rad Powered by Redmine. Den skrivs som en rad text i Redmine: fetstil, kursiv, länkar med egen text och adresser som blir länkar. <version> blir Redmines version när GK Core Stuff finns (annars ingenting). GK Core Stuff:s modul Redmines version i sidfoten sätter i stället versionen i Redmines egen rad. Tom: ingen rad."
  label_gk_gui_stuff_lw_animate: "Inloggningspåminnelsen: animering"
  text_gk_gui_stuff_lw_animate: "Ring som pulserar runt Logga in och en pil som pekar dit. Av: bara banderollen och en stilla markering."
  label_gk_gui_stuff_lw_endless: "Inloggningspåminnelsen: animering utan slut"
  text_gk_gui_stuff_lw_endless: "För skärmar där ingen ska kunna missa den. Annars tre varv."
  text_gk_gui_stuff_lw: "Du är inte inloggad i %{system}. Logga in för att kunna kommentera och redigera."
  gk_gui_stuff_lw_close: "Stäng påminnelsen för i dag"
  label_gk_gui_stuff_mod_long_fields: "Lång beskrivning visas kort"
  text_gk_gui_stuff_mod_long_fields: "En beskrivning som är högre än gränsen fälls ihop med knappen Visa allt. Aldrig i utskrift."
  label_gk_gui_stuff_mod_notes_collapse: "Långa anteckningar visas kort"
  text_gk_gui_stuff_mod_notes_collapse: "En anteckning i historiken som är högre än gränsen fälls ihop."
  label_gk_gui_stuff_mod_private_notes_collapse: "Privata anteckningar är hopfällda"
  text_gk_gui_stuff_mod_private_notes_collapse: "En privat anteckning visas först när man klickar på den, så att den inte råkar synas på en delad skärm."
  label_gk_gui_stuff_mod_code_blocks: "Långa kodblock visas kort"
  text_gk_gui_stuff_mod_code_blocks: "Ett kodblock som är högre än gränsen fälls ihop."
  label_gk_gui_stuff_mod_attachments_collapse: "Många bilagor visas kort"
  text_gk_gui_stuff_mod_attachments_collapse: "När ett ärende har fler bilagor än gränsen visas de första, och en knapp visar alla."
  label_gk_gui_stuff_mod_mailto_copy: "Kopiera e-postadress"
  text_gk_gui_stuff_mod_mailto_copy: "En liten knapp efter varje e-postlänk kopierar adressen. Länken öppnar fortfarande e-postprogrammet."
  label_gk_gui_stuff_mod_mailto_issue: "E-post med ärendets ämne"
  text_gk_gui_stuff_mod_mailto_issue: "På en ärendesida får varje e-postlänk i sidans innehåll (i texten och i fälten) en brevikon efter sig. Ikonen öppnar e-postprogrammet med ämnet ifyllt så som Redmine själv skriver det i sina brev om ärendet: projekt, ärendetyp och nummer inom hakparentes, ärendets status inom parentes när Redmines inställning för status i e-postens ämne är på, sedan ärendets ämne. Ett svar som når Redmines inkommande e-post hamnar då i samma ärende. Klick på själva adressen öppnar ett brev utan ämne, som förut."
  label_gk_gui_stuff_mod_inline_copy: "Klicka på kod för att kopiera"
  text_gk_gui_stuff_mod_inline_copy: "Ett klick på kod inne i en text kopierar den."
  label_gk_gui_stuff_mod_week_number: "Veckonummer vid datumfält"
  text_gk_gui_stuff_mod_week_number: "Varje datumfält säger vilken vecka datumet ligger i (ISO 8601)."
  label_gk_gui_stuff_mod_arrows: "Pilar i text"
  text_gk_gui_stuff_mod_arrows: "<-->, --> och <-- i en text visas som riktiga pilar. Aldrig i kod."
  label_gk_gui_stuff_mod_quick_done: "Spara som klar"
  text_gk_gui_stuff_mod_quick_done: "En knapp bredvid Spara på ärendet som också sätter % Klart till 100."
  label_gk_gui_stuff_mod_parent_link: "Förälderaktiviteten ovanför underaktiviteterna"
  text_gk_gui_stuff_mod_parent_link: "Förälderaktiviteten står också överst i rutan Underaktiviteter, inte bara ovanför ämnet. Har sidan ingen sådan ruta står den överst bland relaterade ärenden."
  label_gk_gui_stuff_mod_instance_band: "Instansens band"
  text_gk_gui_stuff_mod_instance_band: "Ett band överst på varje sida, också inloggningssidan, med instansens roll (till exempel sandbox eller test, ÖVNING för en övning), och rollen först i fönstrets titel. En instans i produktion eller utan roll får inget band."
  label_gk_gui_stuff_mod_footer_text: "Sidfotens text"
  text_gk_gui_stuff_mod_footer_text: "Instansens egen rad längst ner på varje sida (texten skrivs under raden)."
  label_gk_gui_stuff_mod_login_warning: "Påminnelse om inloggning"
  text_gk_gui_stuff_mod_login_warning: "Den som inte är inloggad får en banderoll under toppmenyn och en markering på Logga in; i telefonens meny står det överst. Krysset gäller till midnatt."
  gk_gui_stuff_fold_more: "Visa allt"
  gk_gui_stuff_fold_less: "Visa mindre"
  gk_gui_stuff_fold_private: "Visa privat anteckning"
  gk_gui_stuff_fold_files: "Visa alla %{count}"
  gk_gui_stuff_copied: "Kopierat"
  gk_gui_stuff_copy_address: "Kopiera adressen"
  gk_gui_stuff_copy_address_of: "Kopiera adressen %{address}"
  gk_gui_stuff_mail_write: "Skriv till %{address} (utan ämne)"
  gk_gui_stuff_mail_write_plain: "Skriv till %{address}"
  gk_gui_stuff_mail_issue: "Skriv om det här ärendet till %{address}, med ämnet ifyllt: %{subject}"
  gk_gui_stuff_copy_click: "Klicka för att kopiera"
  gk_gui_stuff_week_short: "v. %{week}"
  gk_gui_stuff_quick_done: "100 % Klart"
  gk_gui_stuff_quick_done_title: "Sätter % Klart till 100 och trycker sedan på %{button}"
