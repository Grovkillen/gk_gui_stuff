  text_gk_gui_stuff_sg_mode_still: "Bara en bild. Inget i exemplet går att hovra över eller tabba till, och ett klick säger bara att exemplet leder ingenstans."
  text_gk_gui_stuff_sg_mode_graphic: "Exemplet går att hovra över och tabba till, så att du ser hur det reagerar. Länkar, knappar och fält säger bara att exemplet leder ingenstans, och inget skickas till servern."
  text_gk_gui_stuff_sg_mode_nosave: "Exemplet reagerar i sidan när du provar det, men skickar ingenting till servern. Det som minns sitt läge gör det bara i den här webbläsaren."
  text_gk_gui_stuff_sg_mode_server: "Exemplet frågar stilguidens egen adress, som inte lagrar något. Ett formulär kommer tillbaka till samma ställe med ett påhittat svar."
  text_gk_gui_stuff_sg_mode_live: "Det som bara syns levande står som stilla bild, och Prova öppnar det riktiga utan att spara något."
  text_gk_gui_stuff_sg_mode_summary: "Rutornas flaggor: %{list}"
  label_gk_gui_stuff_sg_modes_legend: "Rutornas flaggor"
  text_gk_gui_stuff_sg_dummy: "Alla exempel på sidan har påhittade värden, formade efter hur pluginerna använder elementet. Ingenting sparas på servern. Länkar och knappar i bilderna leder ingenstans, utom i rutor märkta Provar mot servern, där sidan får ett påhittat svar. Några exempel minns sitt läge i den här webbläsaren, som det riktiga elementet gör."
  text_gk_gui_stuff_sg_legend: "Varje ruta har en flagga som säger vad exemplet gör:"
  label_gk_gui_stuff_sg_dummy_summary: "Exemplen är påhittade och inget sparas. Flaggorna säger vad varje exempel gör."
