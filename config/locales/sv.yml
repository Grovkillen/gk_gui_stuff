  # Personliga sidor efter version
  label_gk_gui_stuff_personal: "Mina sidor"
  text_gk_gui_stuff_personal_waits: "%{n} väntar på dig"
  text_gk_gui_stuff_personal_waits_split: "%{own} väntar bara på dig, %{shared} kan också andra ta"
  label_gk_gui_stuff_personal_count_seconds: "Antalen vid namnet (sekunder)"
  text_gk_gui_stuff_personal_count_seconds: "Hur länge ett antal på en personlig sida (till exempel Väntar på mig) räknas om högst en gång per person. Personens egen ändring syns direkt. 0: räknas vid varje sida och puls."
  label_gk_gui_stuff_count_split: "Egna och delade var för sig"
  text_gk_gui_stuff_count_split: "Räknaren vid ditt namn visar det som bara väntar på dig och det som också andra kan ta var för sig, till exempel 2+3, i stället för summan."
  gk_gui_stuff_personal: "Mina sidor"
  label_gk_gui_stuff_count_mode: "Räknarna"
  label_gk_gui_stuff_count_mode_waiting: "Visa när något väntar"
  label_gk_gui_stuff_count_mode_zero: "Visa också 0"
  label_gk_gui_stuff_count_mode_none: "Visa inte"
  text_gk_gui_stuff_count_mode: "Antalen vid dina personliga sidor och räknaren vid ditt namn. Visa inte tar bort dem helt; sidorna står kvar."
  # The person's own placement of the buttons
  label_gk_gui_stuff_my_placements: "Knappar ute eller i menyn"
  text_gk_gui_stuff_my_placements: "Varje knapp som pluginen lägger på en sida står ute bland sidans egna länkar, ute med bara sin ikon, eller i trepunktsmenyn. Här väljer du för dig själv; Enligt systeminställningen följer det administratören valt."
  label_gk_gui_stuff_my_placement_default: "Enligt systeminställningen (%{which})"
  label_gk_gui_stuff_layout_sidebar: "Sidopanelen"
  label_gk_gui_stuff_layout_sidebar_after: "Efter innehållet"
  label_gk_gui_stuff_layout_sidebar_before: "Före innehållet"
  label_gk_gui_stuff_layout_sidebar_hidden: "Dold"
  label_gk_gui_stuff_layout_header: "Sidhuvudet"
  label_gk_gui_stuff_layout_header_tall: "Som vanligt"
  label_gk_gui_stuff_layout_header_compact: "Kompakt"
  label_gk_gui_stuff_mod_list_filter: "Filtrera långa listor"
  text_gk_gui_stuff_mod_list_filter: "En lista med fler än 12 kryssrutor (en ärendetyps projekt och anpassade fält, händelserna för e-post, en inställning med flera val) och en tabell med fler än 12 rader (paletten, ett plugins inställningar) får ett filterfält ovanför sig. Det man skriver döljer det som inte matchar, fältet visar hur många av hur många som syns, och Esc eller krysset tömmer fältet. En lång lista med kryssrutor står i en egen ruta som rullar, så att den inte trycker ner sidan. Det som döljs skickas ändå med formuläret. Sidor med core:s filter (ärendelistan och liknande) får inget. Av: core:s listor som de är."
  label_gk_gui_stuff_mod_select_search: "Sökbar väljare för långa listor"
  text_gk_gui_stuff_mod_select_search: "En lista med fler än 15 val, med ett eller flera val, får en väljare där man skriver för att söka. Stängd ser den ut som listan; öppen har den ett sökfält överst och valen under, det valda markerat och de sökta orden i fetstil. Flera val står som etiketter med ett kryss i fältet. Valen står i samma ordning som förut, och det man skriver smalnar av dem. Den riktiga listan står kvar i formuläret och är den som skickas. Piltangenterna flyttar, Enter väljer och Esc stänger. Listor i core:s filter och kolumnval lämnas som de är. Av: core:s listor."
  label_gk_gui_stuff_mod_sticky_save: "Spara som följer med"
  text_gk_gui_stuff_mod_sticky_save: "På core:s inställningar (alla flikar och varje plugins Konfigurera) och i formulär som ber om det står en list längst ner i fönstret med formulärets Spara, så länge formulärets egen Spara är nedanför skärmen. Knappen trycker på formulärets egen Spara, så det finns fortfarande bara en. Notiser står ovanför listen. Av: bara formulärets egen knapp."
  label_gk_gui_stuff_mod_settings_frame: "Konfigurera för GK-plugin"
  text_gk_gui_stuff_mod_settings_frame: "Sidan Konfigurera för varje GK-plugin: rutorna är ihopfällda från början (en sida med en enda ruta har den öppen), en sökruta ovanför dem hittar inställningar på namn och hjälptext och fäller ut rutorna med träffar, och ändringsloggen är ihopfälld med en del per version, den senaste överst och öppen. Inget i formuläret ändras. Av: sidan som pluginet ritar den."
  label_gk_gui_stuff_mod_attachment_sizes: "Knappar för bilagornas storlek"
  text_gk_gui_stuff_mod_attachment_sizes: "På core:s inställningar för filer står knappar för 5 MB, 20 MB, 100 MB och 1 GB bredvid största bilaga och största nedladdning av flera filer. De fyller i värdet i core:s enhet, kB; fältet står kvar och tar vilket värde som helst. Av: bara fälten."
