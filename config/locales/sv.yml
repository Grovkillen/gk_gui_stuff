  label_gk_gui_stuff_icons_other: "Knapparna på övriga sidor"
  label_gk_gui_stuff_area: "området"
  label_gk_gui_stuff_follow_area: "Enligt området (%{which})"
  text_gk_gui_stuff_icons: "Som Redmine: som Redmine ritar det. Ikon och text: en ikon framför texten, också där Redmine saknar ikon. Bara ikon: namnet blir verktygstips och läses upp av skärmläsare; en knapp utan ikon behåller sin text. Förvalet för alla; var och en kan välja under Mitt konto, och valet för en enskild knapp nedan går före området."
  label_gk_gui_stuff_page_issue: "Ärendet"
  label_gk_gui_stuff_page_issue_list: "Ärendelistan"
  label_gk_gui_stuff_page_project: "Projektets översikt"
  label_gk_gui_stuff_page_wiki_page: "Wikisida"
  label_gk_gui_stuff_page_version: "Version"
  label_gk_gui_stuff_page_other: "Övriga sidor"
  label_gk_gui_stuff_mod_admin_groups: "Administrationen i grupper"
  text_gk_gui_stuff_mod_admin_groups: "Administrationens rader står under rubriker i stället för i en rak lista, både på sidan Administration och i sidofältet. En rubrik fäller ihop sin grupp. Vilken grupp en rad hör till väljs under Administrationens rader."
  label_gk_gui_stuff_ag_projects: "Projekt"
  label_gk_gui_stuff_ag_people: "Personer och behörighet"
  label_gk_gui_stuff_ag_issues: "Ärenden och flöden"
  label_gk_gui_stuff_ag_traceability: "Spårbarhet"
  label_gk_gui_stuff_ag_appearance: "Utseende och text"
  label_gk_gui_stuff_ag_system: "System och drift"
  label_gk_gui_stuff_ag_other: "Övrigt"
  label_gk_gui_stuff_ag_rows: "Administrationens rader"
  text_gk_gui_stuff_ag_rows: "Varje rad i administrationen står i en grupp, och pluginet som äger raden ger förvalet (visas i fältet). Under Eget gruppnamn flyttar du raden: skriv en av de kända grupperna (%{groups}) eller ett eget ord, som då blir en egen grupp. Flera namn med komma emellan går också; det första är gruppen raden står i. Tomt fält ger förvalet. Namn är radens ord på ditt språk; tomt ger förvalet, och övriga språk sätts under Översättningar."
  label_gk_gui_stuff_ag_row: "Rad"
  label_gk_gui_stuff_ag_group_now: "Grupp nu"
  label_gk_gui_stuff_ag_tags: "Eget gruppnamn"
  label_gk_gui_stuff_ag_caption: "Namn"
  gk_gui_stuff_ag_caption_settings: "Grundinställningar"
  label_gk_gui_stuff_features: "Funktioner"
  label_gk_gui_stuff_features_modules: "Gränssnittets moduler (gui_stuff)"
  text_gk_gui_stuff_features: "Varje plugins funktioner. En funktion som är av syns inte för användarna; dess data ligger kvar. Förvalet är det en ny installation får. Varje ändring sparas med skälet."
  label_gk_gui_stuff_feature_default: "På från start"
  label_gk_gui_stuff_feature_on: "På"
