  label_gk_gui_stuff_mod_list_filter: "Filtrera långa listor"
  text_gk_gui_stuff_mod_list_filter: "En lista med fler än 12 kryssrutor (en ärendetyps projekt och anpassade fält, händelserna för e-post, en inställning med flera val) och en tabell med fler än 12 rader (paletten, ett plugins inställningar) får ett filterfält ovanför sig. Det man skriver döljer det som inte matchar, fältet visar hur många av hur många som syns, och Esc eller krysset tömmer fältet. En lång lista med kryssrutor står i en egen ruta som rullar, så att den inte trycker ner sidan. Det som döljs skickas ändå med formuläret. Sidor med Redmines filter (ärendelistan och liknande) får inget. Av: Redmines listor som de är."
  label_gk_gui_stuff_mod_select_search: "Sökbar väljare för långa listor"
  text_gk_gui_stuff_mod_select_search: "En lista med fler än 15 val, med ett eller flera val, får en väljare där man skriver för att söka. Stängd ser den ut som listan; öppen har den ett sökfält överst och valen under, det valda markerat och de sökta orden i fetstil. Flera val står som etiketter med ett kryss i fältet. Valen står i samma ordning som förut, och det man skriver smalnar av dem. Den riktiga listan står kvar i formuläret och är den som skickas. Piltangenterna flyttar, Enter väljer och Esc stänger. Listor i Redmines filter och kolumnval lämnas som de är. Av: Redmines listor."
  label_gk_gui_stuff_mod_save_sweep: "Svep mot spara-randen"
  text_gk_gui_stuff_mod_save_sweep: "När en kontroll på en lång rad sparar direkt växer en linje längs radens underkant från kontrollen till spara-randen medan det sparas. När svaret kommer byter linjen till randens läge, sparat eller inte sparat, och krymper in i randen. Dröjer svaret står linjen kvar. Bara där det är över 400 px från kontrollen till spara-randen; inget på raden flyttas, och vid minskad rörelse syns inget svep. Av: bara spara-randen visar läget."
  label_gk_gui_stuff_mod_sticky_save: "Spara som följer med"
  text_gk_gui_stuff_mod_sticky_save: "På Redmines inställningar (alla flikar och varje plugins Konfigurera) och i formulär som ber om det står en list längst ner i fönstret med formulärets Spara, så länge formulärets egen Spara är nedanför skärmen. Knappen trycker på formulärets egen Spara, så det finns fortfarande bara en. Notiser står ovanför listen. Av: bara formulärets egen knapp."
  label_gk_gui_stuff_mod_settings_frame: "Konfigurera för GK-plugin"
  text_gk_gui_stuff_mod_settings_frame: "Sidan Konfigurera för varje GK-plugin: rutorna är ihopfällda från början (en sida med en enda ruta har den öppen), en sökruta ovanför dem hittar inställningar på namn, hjälptext och nyckel och fäller ut rutorna med träffar, varje rad visar sin nyckel tyst, och ändringsloggen är ihopfälld med en del per version, den senaste överst och öppen. Inget i formuläret ändras. Av: sidan som pluginet ritar den."
  label_gk_gui_stuff_mod_attachment_sizes: "Knappar för bilagornas storlek"
  text_gk_gui_stuff_mod_attachment_sizes: "På Redmines inställningar för filer står knappar för 5 MB, 20 MB, 100 MB och 1 GB bredvid största bilaga och största nedladdning av flera filer. De fyller i värdet i Redmines enhet, kB; fältet står kvar och tar vilket värde som helst. Av: bara fälten."
