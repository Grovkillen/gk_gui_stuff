  # Används för och Inte för, en mening var per element
  text_gk_gui_stuff_sg_use_roles: "Färg som betyder något: kategori, larmnivå, gränssnittets ytor, att spara, logik, band och linjen. Ett tema får sätta dem."
  text_gk_gui_stuff_sg_not_roles: "En egen färgkod i ett plugin: ett plugin väljer alltid en roll."
  text_gk_gui_stuff_sg_use_icon_button: "En välkänd handling med bara en ikon, rund, med tips och skärmläsartext: ladda om, stäng, större, mindre, lämna."
  text_gk_gui_stuff_sg_not_icon_button: "En handling som behöver ord för att förstås; den är en knapp med text."
  text_gk_gui_stuff_sg_use_words: "Knappens text: verbet som säger vad som händer, som Spara, Skapa, Verkställ eller Skicka."
  text_gk_gui_stuff_sg_not_words: "Ord som Ok eller Ja, som inte säger vad knappen gör."
  text_gk_gui_stuff_sg_use_admin: "Det som bara administratörer ser, i rollen för administratörer, och låset med Stega upp för det som kräver upphöjning."
  text_gk_gui_stuff_sg_not_admin: "Behörigheter i ett projekt; dem styr Redmines roller."
  text_gk_gui_stuff_sg_use_reason_buttons: "En handling som sparas med ett skäl, med lägena Av, Valfritt och Krävs, och det som inte går att ångra."
  text_gk_gui_stuff_sg_not_reason_buttons: "Ett eget skälfält i ett formulär; skälet har alltid sin egen ruta vid knappen."
  text_gk_gui_stuff_sg_use_popover: "Skäl, bekräftelse och förklaring vid en knapp, i en ruta som fälls ut utan att flytta sidan."
  text_gk_gui_stuff_sg_not_popover: "Webbläsarens egen bekräftelse eller ett eget fönster för samma sak."
  text_gk_gui_stuff_sg_use_mount: "En kontroll som sparar direkt, växel, rund bock, segment eller ikonväxel, med pennan för skäl och låset för upphöjning."
  text_gk_gui_stuff_sg_not_mount: "Fält i ett formulär som väntar på Spara."
  text_gk_gui_stuff_sg_use_rail: "Spara-randen är den 3 px tunna randen i slutet av en rad som sparar direkt. Den visar läget: sparas direkt, ändrat, sparat eller inte sparat. När det har sparats står Sparat en kort stund direkt under kontrollen man tryckte på, som Kopierat; går det inte att spara säger en notis det. Växeln och de andra kontrollerna i rutorna är det man trycker på; randen är det som svarar. Med raden Svep mot spara-randen under Utseende går också en linje längs en lång rad fram till randen medan det sparas. Här står också snabbsparans former."
  text_gk_gui_stuff_sg_not_rail: "Ett formulär med flera fält och en gemensam Spara."
  text_gk_gui_stuff_sg_use_card: "En åtgärd med rubrik och förklaring i en egen ruta, också i rollen larm, med utfällsrutan i."
  text_gk_gui_stuff_sg_not_card: "Ett besked utan handling; det är ett band eller en notis."
  text_gk_gui_stuff_sg_use_pill: "Data som går att läsa, filtrera på eller ta bort: taggar, status och kategori, med antal."
  text_gk_gui_stuff_sg_not_pill: "Handlingar: en handling är en knapp, en bricka är data."
  text_gk_gui_stuff_sg_use_count: "Ett antal vid ett namn eller en rubrik, fylld i larmroll när något väntar och tyst utan roll."
  text_gk_gui_stuff_sg_not_count: "Värden som inte är antal, som datum eller summor."
  text_gk_gui_stuff_sg_use_bars: "Antal i grupper som jämförs, med staplarna på samma lodlinje."
  text_gk_gui_stuff_sg_not_bars: "Tidsserier och diagram."
  text_gk_gui_stuff_sg_use_group: "Det som hör ihop, med kant och rubrik i en roll, och som går att fälla ihop."
  text_gk_gui_stuff_sg_not_group: "Ett formulärs fält; där står Redmines rutor."
  text_gk_gui_stuff_sg_use_lists: "Listor och tabeller: rutan med val som minns, radmenyn för det ovanliga och filtret för långa listor."
  text_gk_gui_stuff_sg_not_lists: "Det som görs ofta på en rad; pennan står kvar i raden."
  text_gk_gui_stuff_sg_use_ss: "Sök och flera val i långa listor, med Lägg till för ett nytt värde som skapas vid Spara."
  text_gk_gui_stuff_sg_not_ss: "Korta listor med några få val; där räcker Redmines egen lista."
  text_gk_gui_stuff_sg_use_category_picker: "Att välja en kategori med dess färg och nummer, fyra gånger tre och Ingen."
  text_gk_gui_stuff_sg_not_category_picker: "Fri färg: en kategori har alltid en av de tolv färgerna."
  text_gk_gui_stuff_sg_use_form: "Ett formulär med flera rutor som var och en har sin Spara och säger vad som är ändrat men inte sparat."
  text_gk_gui_stuff_sg_not_form: "En kontroll som sparar direkt; den står på en rad med spara-rand."
  text_gk_gui_stuff_sg_use_line: "Statusarnas lägen på en linje med halvor, band, spår och steg, i formerna utförlig, kompakt och redigerbar."
  text_gk_gui_stuff_sg_not_line: "En tidslinje med datum: linjen visar lägen, inte tid."
  text_gk_gui_stuff_sg_use_sentence: "Ett filter eller en inställning som en rad med etikett och brickor, där varje del öppnar sin ruta."
  text_gk_gui_stuff_sg_not_sentence: "Ett formulär med fasta fält som alltid syns."
  text_gk_gui_stuff_sg_use_meaning: "Valet mellan Meningsvy och Klassisk vy per sida, med instansens tre lägen."
  text_gk_gui_stuff_sg_not_meaning: "Andra val om hur en sida visas, som sortering eller kolumner."
