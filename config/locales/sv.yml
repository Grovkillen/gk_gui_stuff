  label_gk_gui_stuff_mod_flash_timeout: "Redmines gröna ruta försvinner själv"
  text_gk_gui_stuff_mod_flash_timeout: "Uppdatering lyckades och liknande försvinner efter en tid, med en cirkel som räknar ned (klick pausar) och ett kryss. Fel och varningar står alltid kvar."
  label_gk_gui_stuff_mod_help_link: "Hjälpens mål"
  text_gk_gui_stuff_mod_help_link: "Hjälp i toppmenyn leder dit instansen bestämt under Hjälp: en egen adress eller en wikisida här."
  gk_gui_stuff_flash_pause: "Försvinner om %{count} s. Klicka för att pausa."
  gk_gui_stuff_flash_resume: "Pausad. Klicka för att fortsätta."
  label_gk_gui_stuff_wave_min_ms: "Vågens kortaste tid (ms)"
  text_gk_gui_stuff_wave_min_ms: "En våg som har visats står kvar minst så här länge, så att den inte bara blinkar till när sidan laddas fort. Ett klick eller en tangent tar bort den direkt."
  label_gk_gui_stuff_wave_start_delay_ms: "Vågen väntar innan den visas (ms)"
  text_gk_gui_stuff_wave_start_delay_ms: "SPARAR visas först efter så lång tid. Svarar sidan fortare visas bara utfallet (SPARAT). 0: direkt."
  label_gk_gui_stuff_mod_core_copy_whisper: "Redmines kopiering svarar med viskningen"
  text_gk_gui_stuff_mod_core_copy_whisper: "Det Redmines egna knappar kopierar bekräftas med GK:s viskning i stället för Redmines eget svar, som bocken på knappen. Gäller alla Redmines kopieringsknappar, också sådana som kommer i en senare version."
  label_gk_gui_stuff_mod_whisper_tooltip: "Viskningen släcker hjälptexten"
  text_gk_gui_stuff_mod_whisper_tooltip: "När en viskning visas försvinner Redmines hjälptext vid pekaren direkt, så att de inte står över varandra och hjälptexten inte blir kvar."
  label_gk_gui_stuff_mod_code_copy: "Kopiera kodblock"
  text_gk_gui_stuff_mod_code_copy: "Redmines kopieringsknapp på kodblock syns alltid, inte bara när pekaren är över blocket, går att nå med tangentbordet och svarar med samma notis som annan kopiering."
  gk_gui_stuff_copy_code: "Kopiera kodblocket"
