  label_gk_gui_stuff_mod_key_suggest: "Nyckel föreslagen ur namnet"
  text_gk_gui_stuff_mod_key_suggest: "Ett nyckelfält fylls i ur namnet medan man skriver det (små bokstäver, å, ä och ö som a, a och o, understreck mellan orden) tills man skriver nyckeln själv, och en rad visar hur andra nycklar av samma slag ser ut."
  label_gk_gui_stuff_mod_scroll_shade: "Skugga där en yta rullar vidare"
  text_gk_gui_stuff_mod_scroll_shade: "En yta i GK som rullar (en lista i en panel, valet av kolumner) får en svag skugga i kanten där det finns mer att rulla till, och ingen i slutet, så att det syns att listan fortsätter."
  gk_gui_stuff_key_hint: "Så ser andra ut: %{list}"
  label_gk_gui_stuff_mod_user_status: "Lampan vid namn"
  text_gk_gui_stuff_mod_user_status: "En punkt efter en persons namn visar om hen går att nå just nu (aktiv, inaktiv, borta). Uppgiften kommer från readup, och bara för den som själv valt att synas."
  label_gk_gui_stuff_mod_sticky_columns: "Kolumnrubriker som står kvar"
  text_gk_gui_stuff_mod_sticky_columns: "Listans kolumnrubriker står kvar överst i fönstret när man rullar genom en lång lista, och i arbetsflödets matris står också den första kolumnen kvar när matrisen rullar i sidled. Av i smal skärm."
  label_gk_gui_stuff_mod_overdue_mark: "Försenade ärenden markerade"
  text_gk_gui_stuff_mod_overdue_mark: "Ett öppet ärende med passerat förfallodatum får en röd kant i listor och rött förfallodatum. Med Snart förfallet över noll får också ärenden som förfaller inom så många dagar en gul kant. Pekaren på kanten visar vad färgen betyder."
  text_gk_gui_stuff_mark_overdue: "Försenat: förfallodatumet har passerat"
  text_gk_gui_stuff_mark_due_soon: "Förfaller snart: i dag eller inom %{days} dagar"
  label_gk_gui_stuff_mod_gantt_width: "Dubbelklick vidgar Gantts ämnen"
  text_gk_gui_stuff_mod_gantt_width: "Ett dubbelklick på ämneskolumnen i Gantt (rubriken eller var som helst i kolumnens bakgrund) gör kolumnen så bred att alla ämnen syns hela, och ett nytt dubbelklick ger den tillbaka bredden den hade. Diagrammet behåller alltid en remsa bredvid. Av: kolumnen ändras bara med core:s handtag."
  label_gk_gui_stuff_mod_gantt_fill: "Gantt fyller en bred skärm"
  text_gk_gui_stuff_mod_gantt_fill: "Är Gantt-ytan bredare än de månader som är valda, läggs fler månader till åt höger tills ytan är fylld, och sidan laddas en gång med det antalet (högst core:s gräns, Max antal månader på Gantt-schemat). Månaderna du väljer är det minsta som visas: på en smal skärm står de som valt. Av: Gantt visar bara de valda månaderna."
  label_gk_gui_stuff_mod_calendar_compact: "Komprimerad kalender"
  text_gk_gui_stuff_mod_calendar_compact: "Kalendern får läget Komprimerad bredvid core:s: dagarna lika breda som i core:s, en kort rad per ärende (numret och början av rubriken) eller version och mindre höjd per dag. Ärendetypen och hela rubriken visas när man håller pekaren över raden. Läget väljs med en länk bland kalenderns knappar och sparas i webbläsaren. Av: bara core:s kalender."
  gk_gui_stuff_cal_compact: "Komprimerad"
  gk_gui_stuff_cal_normal: "Vanlig"
  gk_gui_stuff_cal_compact_title: "Visa månaden tätare, en rad per post"
  gk_gui_stuff_cal_normal_title: "Visa kalendern som vanligt"
  label_gk_gui_stuff_mod_collapse_all: "Fäll ihop avsnitt på ärendet"
  text_gk_gui_stuff_mod_collapse_all: "Attribut, beskrivning, underaktiviteter och relaterade ärenden fälls ihop under sin rubrik, och Fäll ihop allt eller Fäll ut allt finns bland ärendets länkar. Läget sparas per avsnitt."
  gk_gui_stuff_sec_attributes: "Attribut"
  gk_gui_stuff_sec_close_all: "Fäll ihop allt"
  gk_gui_stuff_sec_open_all: "Fäll ut allt"
  gk_gui_stuff_sec_empty: "Här finns inget än."
  label_gk_gui_stuff_mod_hide_disabled: "Dölj spärrade åtgärder"
  text_gk_gui_stuff_mod_hide_disabled: "En åtgärd som inte får användas (till exempel Ta bort ärende när ärenden makuleras) visas inte alls i ärendelistans meny. Av: den står kvar dämpad, med en ledtext om varför."
  label_gk_gui_stuff_mod_short_descriptions: "Korta projektbeskrivningar i listor"
  text_gk_gui_stuff_mod_short_descriptions: "Ett projekts beskrivning i en lista (Administration, Projekt och projektlistan) kortas efter så många rader som anges under Värden och slutar med ...; hela texten visas när pekaren vilar på den. Av: hela beskrivningen står i listan."
  label_gk_gui_stuff_description_lines: "Projektbeskrivning i listor: rader"
  text_gk_gui_stuff_description_lines: "Så många rader av ett projekts beskrivning visas i en lista innan den kortas (modulen Korta projektbeskrivningar i listor)."
  text_gk_gui_stuff_box_toggle: "Klicka för att visa eller dölja det som finns under rubriken"
  label_gk_gui_stuff_due_soon_days: "Snart förfallet: dagar"
  text_gk_gui_stuff_due_soon_days_off: "Avstängt (0): varken markeringen eller palettens färg för snart förfallna visas. En installation som sparade sina inställningar före förvalet 3 kan ha 0 kvar."
  text_gk_gui_stuff_due_soon_days: "Öppna ärenden som förfaller i dag eller inom så många dagar markeras (modulen Försenade ärenden markerade). Samma antal dagar gäller för läget Snart förfallna i GK Theme Engines palett. 3 är förvalet; 0 stänger av båda."
  label_gk_gui_stuff_placements: "Knappar och trepunktsmenyn"
  text_gk_gui_stuff_placements: "Varje knapp som pluginen lägger på en sida står antingen ute, bland sidans egna länkar (Ändra, Bevaka), ute med bara sin ikon (namnet som verktygstips), eller i trepunktsmenyn. Pluginet ger förvalet; valet här gäller alla. Kräver modulen Rader i trepunktsmenyn."
  label_gk_gui_stuff_button: "Knapp"
  label_gk_gui_stuff_where_shown: "Sida"
