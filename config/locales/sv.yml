  text_gk_gui_stuff_band_preview_info: "Från %{from} till %{to}. Bara du ser det, så länge du är upphöjd."
  text_gk_gui_stuff_band_preview_save: "Spara %{setting} som %{to} för alla?"
  label_gk_gui_stuff_mod_image_crop: "Välja del av en bild"
  text_gk_gui_stuff_mod_image_crop: "En bild som läggs in, till exempel en bild på en användare, beskärs i webbläsaren: man flyttar en kvadrat över bilden och gör den större eller mindre, och bara den valda delen skickas, i liten storlek. Av: hela filen skickas och servern tar mitten. Bilderna kommer från andra GK-tillägg, i dag personernas bilder i GK People; utan det finns inget här att prova."
  gk_gui_stuff_crop_hint: "Dra kvadraten för att flytta den (eller piltangenterna), och ändra storleken med reglaget, hjulet eller + och -."
  gk_gui_stuff_crop_size: "Storlek på den valda delen"
  label_gk_gui_stuff_mod_key_suggest: "Nyckel föreslagen ur namnet"
  text_gk_gui_stuff_mod_key_suggest: "Ett nyckelfält fylls i ur namnet medan man skriver det (små bokstäver, å, ä och ö som a, a och o, understreck mellan orden) tills man skriver nyckeln själv, och en rad visar hur andra nycklar av samma slag ser ut."
  label_gk_gui_stuff_mod_scroll_shade: "Skugga där en yta rullar vidare"
  text_gk_gui_stuff_mod_scroll_shade: "På Redmines egna sidor får en yta som rullar (en lista i en panel, valet av kolumner, en bred ärendelista, arbetsflödets tabell) en svag skugga i varje kant där det finns mer att rulla till, uppåt, nedåt och i sidled, och ingen i slutet, så att det syns att listan fortsätter. GK:s egna sidor har alltid skuggan."
  gk_gui_stuff_key_hint: "Så ser andra ut: %{list}"
  label_gk_gui_stuff_mod_user_status: "Lampan vid namn"
  text_gk_gui_stuff_mod_user_status: "En punkt efter en persons namn visar om hen går att nå just nu (aktiv, inaktiv, borta). Uppgiften kommer från readup, och bara för den som själv valt att synas."
  label_gk_gui_stuff_mod_sticky_columns: "Kolumnrubriker som står kvar"
  text_gk_gui_stuff_mod_sticky_columns: "Listans kolumnrubriker står kvar överst i fönstret när man rullar genom en lång lista, och i arbetsflödets matris står också den första kolumnen kvar när matrisen rullar i sidled. Av i smal skärm."
  label_gk_gui_stuff_mod_overdue_mark: "Försenade ärenden markerade"
  text_gk_gui_stuff_mod_overdue_mark: "Ett öppet ärende med passerat förfallodatum får en röd kant i listor och rött förfallodatum. Med Snart förfallet över noll får också ärenden som förfaller inom så många dagar en gul kant. Pekaren på kanten visar vad färgen betyder."
  text_gk_gui_stuff_mark_overdue: "Försenat: förfallodatumet har passerat"
  text_gk_gui_stuff_mark_due_soon: "Förfaller snart: i dag eller inom %{days} dagar"
  label_gk_gui_stuff_mod_gantt_width: "Dubbelklick vidgar Gantts ämnen"
  text_gk_gui_stuff_mod_gantt_width: "Ett dubbelklick på ämneskolumnen i Gantt (rubriken eller var som helst i kolumnens bakgrund) gör kolumnen så bred att alla ämnen syns hela, och ett nytt dubbelklick ger den tillbaka bredden den hade. Diagrammet behåller alltid en remsa bredvid. Av: kolumnen ändras bara med Redmines handtag."
  label_gk_gui_stuff_mod_gantt_fill: "Gantt fyller en bred skärm"
  text_gk_gui_stuff_mod_gantt_fill: "Är Gantt-ytan bredare än de månader som är valda, läggs fler månader till åt höger tills ytan är fylld, och sidan laddas en gång med det antalet (högst Redmines gräns, Max antal månader på Gantt-schemat). Månaderna du väljer är det minsta som visas: på en smal skärm står de som valt. Av: Gantt visar bara de valda månaderna."
  label_gk_gui_stuff_mod_calendar_compact: "Komprimerad kalender"
  text_gk_gui_stuff_mod_calendar_compact: "Kalendern får läget Komprimerad bredvid Redmines: dagarna lika breda som i Redmines, en kort rad per ärende (numret och början av rubriken) eller version och mindre höjd per dag. Ärendetypen och hela rubriken visas när man håller pekaren över raden. Läget väljs med en länk bland kalenderns knappar och sparas i webbläsaren. Av: bara Redmines kalender."
  gk_gui_stuff_cal_compact: "Komprimerad"
