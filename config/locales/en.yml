  text_gk_gui_stuff_shared_notices: "How long a notice stays and how many stand at a time, for every notice."
  text_gk_gui_stuff_shared_due_soon: "Days before the due date."
  text_gk_gui_stuff_shared_beat: "How often an open issue page asks whether the issue changed. 0: no heartbeat."
  text_gk_gui_stuff_notice_seconds_info: "Applies to notices on the level Tip, Information and Notice. A notice on the level Warning, Alarm or Critical stays until it is closed."
  label_gk_gui_stuff_notice_max: "At most at a time:"
  text_gk_gui_stuff_notice_max_info: "When more come, the oldest that goes away by itself is taken away. A notice that is to stay (Warning, Alarm, Critical or one closed by hand) is never taken away to make room, so more than this may stand. When they do not fit in the window one can scroll among them."
  text_gk_gui_stuff_due_soon_days_info: "The same number of days holds for the state Issues due soon in GK Theme Engine's palette; 0 turns both off."
  text_gk_gui_stuff_beat_seconds_info: "Costs 2 requests per minute for each open, visible page at 30 seconds. 0 also turns off the corner fold."
