en:
  label_gk_gui_stuff_about: "About the plugin"
  label_gk_gui_stuff_changelog: "Changelog"
  text_gk_gui_stuff_changelog_english: "The change log is always written in English."
  text_gk_gui_stuff_description: "Collection of small, switchable UI modules"
  label_gk_gui_stuff_switches: "On and off"
  label_gk_gui_stuff_core_like: "Core-like (everything off)"
  text_gk_gui_stuff_core_like: "Switches every module off for everyone. The pages are then Redmine's own."
  label_gk_gui_stuff_user_core_like: "Users may choose the core-like experience"
  text_gk_gui_stuff_user_core_like: "Each person can then switch every module off for themselves under My account."
  label_gk_gui_stuff_modules: "Modules"
  button_gk_gui_stuff_recommend: "GK's recommendation"
  text_gk_gui_stuff_recommend: "GK's recommendation sets every module as GK recommends; Like core switches off every one that can be switched off, so that the pages are core's. The rows that change are marked. Nothing is saved until you press Apply."
  text_gk_gui_stuff_recommend_changed: "%{count} modules changed to GK's recommendation and marked. Press Apply to save."
  button_gk_gui_stuff_core_mode: "Like core"
  text_gk_gui_stuff_core_mode_changed: "%{count} modules switched off, like core, and marked. Press Apply to save."
  label_gk_gui_stuff_module: "Module"
  label_gk_gui_stuff_mode: "Mode"
  label_gk_gui_stuff_mode_off: "Off"
  label_gk_gui_stuff_mode_optional: "Optional (each person may switch it off)"
  label_gk_gui_stuff_mode_forced: "Forced (on for everyone)"
  label_gk_gui_stuff_preview_delay: "The card shows after (ms)"
  label_gk_gui_stuff_mod_link_preview: "Card on hover"
  text_gk_gui_stuff_mod_link_preview: "A card with the essentials of an issue, a person or a group when the pointer rests on the link. Alt and arrow down opens it from the keyboard, Esc closes it. How long the pointer must rest is set under Values (500 ms by default)."
  label_gk_gui_stuff_mod_openers: "Open in a panel or full screen"
  text_gk_gui_stuff_mod_openers: "A button a field shows (a map, for example) opens its content in a panel or over the whole screen. Close and Esc close it, and the focus goes back to the button. Without the module the field shows its text version. The buttons come from other GK plugins, today the field appearances in GK Fields and the maps in GK GIS; without one of them there is nothing here to try."
  text_gk_gui_stuff_safety: "safety module: not a user's choice"
  label_gk_gui_stuff_my: "Appearance and aids"
  label_gk_gui_stuff_core_like_me: "Core-like experience"
  text_gk_gui_stuff_core_like_me: "Switches every module off for you. The pages are then Redmine's own."
  text_gk_gui_stuff_not_released: "decided by the administrator"
  text_gk_gui_stuff_instance_core_like: "The administrator has chosen Core-like for the whole system. Your choices here apply when that changes."
  label_gk_gui_stuff_event_choice_changed: "Own choice changed (appearance and aids)"
  text_gk_gui_stuff_and_more: "and %{count} more"
  button_gk_gui_stuff_open: "Open"
  label_gk_gui_stuff_mod_members_by_group: "Members through a group are shown as the group"
  text_gk_gui_stuff_mod_members_by_group: "The project's Members box lists only those added directly. A member through a group is not listed separately: the group is there with its role, and the card on the group says who is in it."
  label_gk_gui_stuff_mod_report_clarity: "Clearer report table"
  text_gk_gui_stuff_mod_report_clarity: "The report Issues by ... tells statuses apart from the sums Open and Closed (with the statuses they include) and from Total, and each chart gets a heading and a line on what it shows."
  label_gk_gui_stuff_rep_group_status: "Status"
  label_gk_gui_stuff_rep_group_sum: "Sum per state"
  label_gk_gui_stuff_rep_group_total: "All"
  label_gk_gui_stuff_rep_closed_status: "closed status"
  label_gk_gui_stuff_rep_total_note: "= open + closed"
  label_gk_gui_stuff_rep_chart_by_row: "One bar per row in the table, split by status. Closed statuses are hidden at first. Click a status in the legend to show or hide it."
  label_gk_gui_stuff_rep_chart_by_status: "One bar per status, split by the rows in the table. Click a name in the legend to show or hide it."
  label_gk_gui_stuff_values: "Values"
  label_gk_gui_stuff_fold_height: "Fold above (px)"
  text_gk_gui_stuff_fold_height: "A description, note or code block taller than this is shown short with the button Show all."
  label_gk_gui_stuff_fold_attachments: "Show at most this many attachments"
  label_gk_gui_stuff_attachments_newest: "Newest attachment first"
  text_gk_gui_stuff_attachments_newest: "An issue's attachments stand with the newest at the top instead of core's order, oldest first. Works with the module Many attachments shown short on, and the short list then shows the newest."
  label_gk_gui_stuff_footer_text: "Footer text"
  text_gk_gui_stuff_footer_text: "A line of its own at the bottom of every page, under core's line Powered by Redmine. It is written as one line of text in Redmine: bold, italic, links with a text of their own, and addresses that become links. <version> becomes Redmine's version when GK Core Stuff is there (otherwise nothing). GK Core Stuff's module Redmine's version in the footer instead puts the version in core's own line. Empty: no line."
  label_gk_gui_stuff_lw_animate: "Login reminder: animation"
  text_gk_gui_stuff_lw_animate: "A pulsing ring around Sign in and an arrow pointing at it. Off: only the banner and a still mark."
  label_gk_gui_stuff_lw_endless: "Login reminder: animation without end"
  text_gk_gui_stuff_lw_endless: "For screens where nobody must miss it. Otherwise three rounds."
  text_gk_gui_stuff_lw: "You are not signed in to %{system}. Sign in to comment and edit."
  gk_gui_stuff_lw_close: "Close the reminder for today"
  label_gk_gui_stuff_mod_long_fields: "Long description shown short"
  text_gk_gui_stuff_mod_long_fields: "A description taller than the limit is folded with the button Show all. Never in print."
  label_gk_gui_stuff_mod_notes_collapse: "Long notes shown short"
  text_gk_gui_stuff_mod_notes_collapse: "A note in the history taller than the limit is folded."
  label_gk_gui_stuff_mod_private_notes_collapse: "Private notes are folded"
  text_gk_gui_stuff_mod_private_notes_collapse: "A private note is shown only when clicked, so that it is not seen by accident on a shared screen."
  label_gk_gui_stuff_mod_code_blocks: "Long code blocks shown short"
  text_gk_gui_stuff_mod_code_blocks: "A code block taller than the limit is folded."
  label_gk_gui_stuff_mod_attachments_collapse: "Many attachments shown short"
  text_gk_gui_stuff_mod_attachments_collapse: "When an issue has more attachments than the limit the first are shown, and a button shows all."
  label_gk_gui_stuff_mod_mailto_copy: "Copy mail address"
  text_gk_gui_stuff_mod_mailto_copy: "A small button after every mail link copies the address. The link still opens the mail program."
  label_gk_gui_stuff_mod_inline_copy: "Click code to copy"
  text_gk_gui_stuff_mod_inline_copy: "A click on code inside a text copies it."
  label_gk_gui_stuff_mod_week_number: "Week number at date fields"
  text_gk_gui_stuff_mod_week_number: "Every date field says which week its date is in (ISO 8601)."
  label_gk_gui_stuff_mod_arrows: "Arrows in text"
  text_gk_gui_stuff_mod_arrows: "<-->, --> and <-- in a text are shown as real arrows. Never in code."
  label_gk_gui_stuff_mod_quick_done: "Save as done"
  text_gk_gui_stuff_mod_quick_done: "A button beside Submit on the issue that also sets % done to 100."
  label_gk_gui_stuff_mod_parent_link: "The parent above the subtasks"
  text_gk_gui_stuff_mod_parent_link: "The parent issue also stands at the top of the Subtasks box, not only above the subject. When the page has no such box it stands at the top of the related issues."
  label_gk_gui_stuff_mod_footer_text: "Footer text"
  text_gk_gui_stuff_mod_footer_text: "The instance's own line at the bottom of every page (the text is written under Values)."
  label_gk_gui_stuff_mod_login_warning: "Login reminder"
  text_gk_gui_stuff_mod_login_warning: "Someone not signed in gets a banner under the top menu and a mark on Sign in; in the phone menu it stands first. The cross holds until midnight."
  gk_gui_stuff_fold_more: "Show all"
  gk_gui_stuff_fold_less: "Show less"
  gk_gui_stuff_fold_private: "Show private note"
  gk_gui_stuff_fold_files: "Show all %{count}"
  gk_gui_stuff_copied: "Copied"
  gk_gui_stuff_copy_address: "Copy the address"
  gk_gui_stuff_copy_click: "Click to copy"
  gk_gui_stuff_week_short: "w. %{week}"
  gk_gui_stuff_quick_done: "100 % done"
  gk_gui_stuff_quick_done_title: "Sets % done to 100 and then presses %{button}"
  gk_gui_stuff_parent: "Parent issue"
  gk_gui_stuff_history: "Recently visited"
  gk_gui_stuff_history_empty: "No pages yet"
  label_gk_gui_stuff_instance_drill: "DRILL"
  label_gk_gui_stuff_beat_seconds: "Heartbeat (seconds)"
  text_gk_gui_stuff_beat_seconds: "How often an open issue page asks whether the issue changed. Costs 2 requests per minute and open, visible page at 30 s. 0: no heartbeat and no corner fold."
  label_gk_gui_stuff_wave_opacity_pct: "The wave's background (per cent)"
  text_gk_gui_stuff_wave_opacity_pct: "How dense the colour behind the word is. 0: only the word."
  label_gk_gui_stuff_wave_first_ms: "The wave's time the first ten times (ms)"
  text_gk_gui_stuff_wave_first_ms: "Someone new sees what happened."
  label_gk_gui_stuff_wave_ms: "The wave's time after that (ms)"
  text_gk_gui_stuff_wave_ms: "Someone used to it only sees the wave pass."
  label_gk_gui_stuff_loading_delay_ms: "LOADING shown after (ms)"
  text_gk_gui_stuff_loading_delay_ms: "Only when the next page is slow."
  label_gk_gui_stuff_notice_seconds: "The notice stays (seconds)"
  text_gk_gui_stuff_notice_seconds: "How long a notice on the level Info or Notice stays before it goes by itself, in seconds (at least 4). A notice on the level Warning, Alarm or Critical stays until you close it."
  label_gk_gui_stuff_corner_max_entries: "The fold's card: at most this many rows"
  text_gk_gui_stuff_corner_max_entries: "The rest is counted as and N more."
  label_gk_gui_stuff_wave_hide_flash: "Hide Redmine's green box when the wave has shown"
  text_gk_gui_stuff_wave_hide_flash: "The wave then says what the box said, and the box is not shown. Off: both are shown. Without the wave (the module off, for everyone or for one user) the box is always shown, with countdown and cross if that module is on."
  label_gk_gui_stuff_declutter: "Hidden"
  text_gk_gui_stuff_declutter: "What is ticked is hidden for everyone. Hiding is never permission: what must not be done is a role or a rule."
  label_gk_gui_stuff_dc_top_help: "Top menu: Help"
  label_gk_gui_stuff_dc_footer_powered: "Footer: Powered by Redmine"
  label_gk_gui_stuff_dc_issue_log_time: "Issue page: Log time"
  label_gk_gui_stuff_dc_issue_copy: "Issue page: Copy"
  label_gk_gui_stuff_dc_sidebar_watchers: "Sidebar: Watchers"
  label_gk_gui_stuff_dc_form_estimated_hours: "Form: Estimated time"
  label_gk_gui_stuff_dc_form_done_ratio: "Form: % done"
  label_gk_gui_stuff_mod_recent_pages: "Recently visited"
  text_gk_gui_stuff_mod_recent_pages: "A list in the top menu of the pages you were last on. Kept in this browser only."
  label_gk_gui_stuff_mod_wave: "Wave at saved and loading"
  text_gk_gui_stuff_mod_wave: "A word over the whole page that comes and goes: SAVING when a form is sent, SAVED when the page returns, LOADING when the next page is slow. Never takes the pointer; a click or a key removes it."
  label_gk_gui_stuff_mod_corner: "Corner fold when the issue changed"
  text_gk_gui_stuff_mod_corner: "A fold in the corner of the issue page when someone changed the issue since you opened it, with who, when and what. Needs the heartbeat."
  label_gk_gui_stuff_mod_history_navigator: "Jump in the issue's history"
  text_gk_gui_stuff_mod_history_navigator: "g opens a list of the issue's notes to search and jump in; j and k go to the next and previous note."
  label_gk_gui_stuff_mod_actions_menu: "Rows in the three-dot menu"
  text_gk_gui_stuff_mod_actions_menu: "Plugins put their rows in Redmine's three-dot menu, in sections, instead of buttons of their own."
  label_gk_gui_stuff_mod_fullscreen: "Only the content"
  text_gk_gui_stuff_mod_fullscreen: "The row Only the content in the three-dot menu (…) on the issue, the issue list, the project, the wiki page and the version hides menus, header and sidebar. The choice follows you between computers. Esc goes back."
  label_gk_gui_stuff_mod_branch_jump: "Jump in the project branch"
  text_gk_gui_stuff_mod_branch_jump: "The sign » at the project name shows parent, siblings and children in the project tree, with open issues, and the jump keeps the tab you stand in."
  label_gk_gui_stuff_mod_declutter: "Hidden"
  text_gk_gui_stuff_mod_declutter: "Hides what is ticked under Hidden, for everyone."
  gk_gui_stuff_close: "Close"
  gk_gui_stuff_dismiss: "Dismiss"
  gk_gui_stuff_reload: "Reload"
  gk_gui_stuff_reload_unsaved: "You have written text that is not saved. Reload anyway?"
  gk_gui_stuff_and_more: "and %{count} more"
  gk_gui_stuff_no_hits: "No hits"
  gk_gui_stuff_corner_title: "Changed since you opened the page"
  gk_gui_stuff_drawer_size: "Change the panel's height"
  gk_gui_stuff_drawer_empty: "Empty and close the panel"
  gk_gui_stuff_menu: "Menu"
  gk_gui_stuff_view_not_saved: "The choice could not be saved"
  gk_gui_stuff_wave_saved: "Saved"
  gk_gui_stuff_wave_saving: "Saving"
  gk_gui_stuff_wave_deleted: "Deleted"
  gk_gui_stuff_wave_deleting: "Deleting"
  gk_gui_stuff_wave_loading: "Loading"
  gk_gui_stuff_wave_logging_in: "Logging in"
  gk_gui_stuff_wave_logged_in: "Logged in"
  gk_gui_stuff_wave_sending: "Sending"
  gk_gui_stuff_wave_sent: "Sent"
  gk_gui_stuff_wave_reading_in: "Reading in"
  gk_gui_stuff_wave_read_in: "Read in"
  gk_gui_stuff_wave_running: "Running"
  gk_gui_stuff_wave_finished: "Done"
  gk_gui_stuff_wave_failed: "Failed"
  gk_gui_stuff_wave_importing: "Importing"
  gk_gui_stuff_wave_imported: "Imported"
  gk_gui_stuff_hn_title: "Jump"
  gk_gui_stuff_hn_placeholder: "Search the issue's history"
  gk_gui_stuff_hn_empty: "The issue has no history yet"
  gk_gui_stuff_hn_changes: "%{count} changes, no note"
  gk_gui_stuff_branch: "Show the project branch"
  gk_gui_stuff_branch_open: "%{count} open"
  gk_gui_stuff_branch_projects: "%{count} projects"
  gk_gui_stuff_menu_history: "Jump in the history"
  gk_gui_stuff_menu_fullscreen: "Only the content (on and off)"
  label_gk_gui_stuff_flash_seconds: "Redmine's green box goes away after (seconds)"
  text_gk_gui_stuff_flash_seconds: "A circle counts down; a click on it pauses, the cross closes at once. 0: the box stays, only the cross is added."
  label_gk_gui_stuff_help: "Help"
  text_gk_gui_stuff_help: "Where Help in the top menu leads. Applies when the module Where help leads is on."
  label_gk_gui_stuff_help_kind: "Help leads to"
  label_gk_gui_stuff_help_kind_core: "Redmine's own guide"
  label_gk_gui_stuff_help_kind_url: "an address"
  label_gk_gui_stuff_help_kind_wiki: "a wiki page here"
  label_gk_gui_stuff_help_url: "Address"
  text_gk_gui_stuff_help_url: "https://... or a path in the system starting with /"
  label_gk_gui_stuff_help_wiki_project: "The wiki's project"
  label_gk_gui_stuff_help_wiki_page: "Wiki page"
  text_gk_gui_stuff_help_wiki_page: "Empty: the wiki's start page."
  label_gk_gui_stuff_mod_flash_timeout: "Redmine's green box goes away by itself"
  text_gk_gui_stuff_mod_flash_timeout: "Successful update and the like go away after a time, with a circle counting down (a click pauses) and a cross. Errors and warnings always stay."
  label_gk_gui_stuff_mod_help_link: "Where help leads"
  text_gk_gui_stuff_mod_help_link: "Help in the top menu leads where the instance decided under Help: an address of its own or a wiki page here."
  gk_gui_stuff_flash_pause: "Goes away in %{count} s. Click to pause."
  gk_gui_stuff_flash_resume: "Paused. Click to continue."
  label_gk_gui_stuff_wave_min_ms: "The wave's shortest time (ms)"
  text_gk_gui_stuff_wave_min_ms: "A wave that has been shown stays at least this long, so that it does not just flash when the page loads fast. A click or a key takes it away at once."
  label_gk_gui_stuff_wave_start_delay_ms: "The wave waits before it shows (ms)"
  text_gk_gui_stuff_wave_start_delay_ms: "SAVING shows only after this time. If the page answers faster only the outcome (SAVED) is shown. 0: at once."
  label_gk_gui_stuff_mod_code_copy: "Copy code blocks"
  text_gk_gui_stuff_mod_code_copy: "Redmine's copy button on code blocks is always shown, not only under the pointer, can be reached with the keyboard and answers with the same notice as other copying."
  gk_gui_stuff_copy_code: "Copy the code block"
  label_gk_gui_stuff_notice_countdown: "Show countdown on notices"
  text_gk_gui_stuff_notice_countdown: "Notices that go away by themselves show a circle counting down; a click pauses. Off: they go after the time without a circle. Warnings always stay. Confirmations like Code block copied are no notice and have neither circle nor cross."
  gk_gui_stuff_copied_mail: "Mail address copied"
  gk_gui_stuff_copied_code: "Code copied"
  gk_gui_stuff_copied_block: "Code block copied"
  gk_gui_stuff_loading: "Loading..."
  label_gk_gui_stuff_mod_custom_mark: "Mark on custom fields in the row menu"
  text_gk_gui_stuff_mod_custom_mark: "In the row menu of lists custom fields get a small mark, so that it shows what is the organisation's own and what is Redmine's."
  label_gk_gui_stuff_custom_mark_style: "Mark on custom fields"
  text_gk_gui_stuff_custom_mark_style: "How custom fields are marked in the row menu."
  label_gk_gui_stuff_custom_mark_diamond: "small diamond after the name"
  label_gk_gui_stuff_custom_mark_stripe: "line at the left edge"
  label_gk_gui_stuff_custom_mark_italic: "italic text"
  label_gk_gui_stuff_quick_done_status: "100 % done: status per tracker"
  text_gk_gui_stuff_quick_done_status: "The button 100 % done can also set a status, different per tracker. The status is set only when the workflow lets the person choose it from the issue's current status; otherwise only % done is set."
  label_gk_gui_stuff_quick_done_no_status: "no status, only % done"
  gk_gui_stuff_quick_done_title_status: "Sets % done to 100 and the status to %{status}, and then presses %{button}"
  text_gk_gui_stuff_instance_copy: "Click to copy the build tag"
  text_gk_gui_stuff_instance_copied: "build tag copied"
  label_gk_gui_stuff_mod_image_crop: "Choosing part of a picture"
  text_gk_gui_stuff_mod_image_crop: "A picture being added, for instance a picture of a user, is cropped in the browser: a square is moved over the picture and made larger or smaller, and only the chosen part is sent, in a small size. Off: the whole file is sent and the server takes the middle. The pictures come from other GK plugins, today the people's pictures in GK People; without it there is nothing here to try."
  gk_gui_stuff_crop_hint: "Drag the square to move it (or use the arrow keys), and change its size with the slider, the wheel or + and -."
  gk_gui_stuff_crop_size: "Size of the chosen part"
  label_gk_gui_stuff_mod_key_suggest: "Key suggested from the name"
  text_gk_gui_stuff_mod_key_suggest: "A key field is filled in from the name as it is written (small letters, å, ä and ö as a, a and o, underscores between the words) until the person writes the key, and a line shows how other keys of the kind look."
  label_gk_gui_stuff_mod_scroll_shade: "Shadow where a surface scrolls on"
  text_gk_gui_stuff_mod_scroll_shade: "A GK surface that scrolls (a list in a panel, the columns chooser) gets a faint shadow at the edge where there is more to scroll to, and none at an end, so that the list is seen to go on."
  gk_gui_stuff_key_hint: "Others look like: %{list}"
  label_gk_gui_stuff_mod_user_status: "The lamp by names"
  text_gk_gui_stuff_mod_user_status: "A dot after a person's name shows whether she can be reached now (active, idle, away). The data comes from readup, and only for those who chose to be seen."
  label_gk_gui_stuff_mod_sticky_columns: "Column headers that stay"
  text_gk_gui_stuff_mod_sticky_columns: "A list's column headers stay at the top of the window while scrolling through a long list, and in the workflow matrix the first column also stays when the matrix scrolls sideways. Off on narrow screens."
  label_gk_gui_stuff_mod_overdue_mark: "Overdue issues marked"
  text_gk_gui_stuff_mod_overdue_mark: "An open issue past its due date gets a red edge in lists and a red due date. With Due soon above zero, issues due within that many days get a yellow edge. The pointer on the edge shows what the colour means."
  text_gk_gui_stuff_mark_overdue: "Overdue: the due date has passed"
  text_gk_gui_stuff_mark_due_soon: "Due soon: today or within %{days} days"
  label_gk_gui_stuff_mod_gantt_width: "Double click widens the Gantt subjects"
  text_gk_gui_stuff_mod_gantt_width: "A double click on the Gantt chart's subjects column (its heading or anywhere in the column's background) makes the column wide enough for every subject to be read in full, and a new double click gives it back the width it had. The chart always keeps a strip beside it. Off: the column is changed only with core's handle."
  label_gk_gui_stuff_mod_gantt_fill: "Gantt fills a wide screen"
  text_gk_gui_stuff_mod_gantt_fill: "When the Gantt area is wider than the months chosen, more months are added to the right until the area is filled, and the page is loaded once with that number (at most core's limit, Gantt months limit). The months you choose are the least that is shown: on a narrow screen they stand as chosen. Off: Gantt shows only the months chosen."
  label_gk_gui_stuff_mod_calendar_compact: "Compact calendar"
  text_gk_gui_stuff_mod_calendar_compact: "The calendar gets a Compact view beside core's: the days as wide as in core's, one short line per issue (its number and the start of its subject) or version and less height per day. The tracker and the whole subject show when the pointer rests on the line. The view is chosen with a link among the calendar's buttons and remembered in the browser. Off: only core's calendar."
  gk_gui_stuff_cal_compact: "Compact"
  gk_gui_stuff_cal_normal: "Normal"
  gk_gui_stuff_cal_compact_title: "Show the month tighter, one line per entry"
  gk_gui_stuff_cal_normal_title: "Show the calendar as usual"
  label_gk_gui_stuff_mod_collapse_all: "Fold sections of the issue"
  text_gk_gui_stuff_mod_collapse_all: "Attributes, description, subtasks and related issues fold under their label, and Collapse all or Expand all is among the issue's links. The state is kept per section."
  gk_gui_stuff_sec_attributes: "Attributes"
  gk_gui_stuff_sec_close_all: "Collapse all"
  gk_gui_stuff_sec_open_all: "Expand all"
  gk_gui_stuff_sec_empty: "Nothing here yet."
  label_gk_gui_stuff_mod_hide_disabled: "Hide actions that are closed"
  text_gk_gui_stuff_mod_hide_disabled: "An action that may not be used (such as Delete issue when issues are annulled) is not shown at all in the issue list's menu. Off: it stays dimmed, with a tooltip that says why."
  label_gk_gui_stuff_mod_filled_badges: "Filled badges"
  text_gk_gui_stuff_mod_filled_badges: "The status badges (such as Open, Locked, Closed, ON and OFF) are filled with their own colour and the text is white, on every page, core's and the GK plugins'. Off: core's outlined badges."
  label_gk_gui_stuff_mod_short_descriptions: "Short project descriptions in lists"
  text_gk_gui_stuff_mod_short_descriptions: "A project's description in a list (Administration, Projects and the project list) is cut after the number of lines set under Values and ends with ...; the whole text shows when the pointer rests on it. Off: the whole description stands in the list."
  label_gk_gui_stuff_description_lines: "Project description in lists: lines"
  text_gk_gui_stuff_description_lines: "This many lines of a project's description are shown in a list before it is cut (the module Short project descriptions in lists)."
  text_gk_gui_stuff_box_toggle: "Click to show or hide what is under the heading"
  label_gk_gui_stuff_due_soon_days: "Due soon: days"
  text_gk_gui_stuff_due_soon_days_off: "Off (0): neither the mark nor the palette's colour for issues due soon shows. An installation that saved its settings before the default became 3 may still have 0."
  text_gk_gui_stuff_due_soon_days: "Open issues due today or within this many days are marked (the module Overdue issues marked). The same number of days holds for the state Issues due soon in GK Theme Engine's palette. 3 is the default; 0 turns both off."
  label_gk_gui_stuff_placements: "Buttons and the three-dot menu"
  text_gk_gui_stuff_placements: "Every button the plugins put on a page stands either out, among the page's own links (Edit, Watch), out with its icon only (the name as tooltip), or in the three-dot menu. The plugin gives the default; the choice here applies to everyone. Needs the module Rows in the three-dot menu."
