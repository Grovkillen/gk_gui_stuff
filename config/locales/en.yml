  label_gk_gui_stuff_sg_show_where: "Show where"
  text_gk_gui_stuff_sg_show_where: "When something comes up outside the window, an arrow stands in the window's edge towards it, with a word about what came up. The view never moves by itself. A click scrolls there, the target gets a ring that pulses twice, and Back stands in the lower edge until it is used or you scroll yourself. The arrow goes when the target is seen and after 20 seconds. Several arrows in the same direction stack and do not cover each other. The examples are made up: the targets stand in a box of their own that scrolls, the arrows in the real window, and nothing is saved."
  text_gk_gui_stuff_sg_use_show_where: "What comes up outside the window, such as banners and ribbons, and showing step by step where to look."
  text_gk_gui_stuff_sg_not_show_where: "What is already seen; then no arrow comes. The corner, which says itself with a notice and the same Show."
  label_gk_gui_stuff_sg_where_parts: "The parts"
  label_gk_gui_stuff_sg_where_goal: "Example: the target with its ring"
  label_gk_gui_stuff_sg_where_arrow: "Arrow towards the target"
