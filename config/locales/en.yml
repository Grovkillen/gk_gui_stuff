  label_gk_gui_stuff_job_link_preview_forget: "Previews: thin out"
  text_gk_gui_stuff_job_link_preview_forget: "Removes previews nobody has shown for the time set under Appearance, previews from domains no longer in the list and, while the pictures together are over their cap, the picture from the previews shown longest ago. While the setting cannot be read the standard limits are used and nothing is removed because of its domain."
