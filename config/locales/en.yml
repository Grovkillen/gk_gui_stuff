  text_gk_gui_stuff_sg_use_entry: "Notes on a thing: each entry with its kind, who, when and number, the text, a quiet line under it and the answers indented behind a line. A voided entry is folded, a corrected one has softer text."
  text_gk_gui_stuff_sg_not_entry: "Redmine's own history, which has its own look, and rows of a table."
  text_gk_gui_stuff_sg_entry_example: "Example: the people, the times, the numbers and the texts are made up, and nothing is saved."
