  # The preview of external links and the links to other websites
  label_gk_gui_stuff_mod_link_preview_external: "External link preview"
  text_gk_gui_stuff_mod_link_preview_external: "A preview with title, description and picture for links to other websites. The server fetches the page in the background, only from the domains in the list, and by default only for links written with the macro {{gk_link_preview(address)}}. The picture is shown from the instance. A reader who is not logged in never gets an external preview, so an anonymous reader never makes the server fetch anything from outside."
  label_gk_gui_stuff_mod_external_new_tab: "Open external links in a new tab"
  text_gk_gui_stuff_mod_external_new_tab: "A link to another website opens in a new tab, in a text and wherever it has the look of an external link (custom fields, the project's homepage, GK People and GK Icons). The tooltip and the screen reader say so. Each person chooses under My account, Appearance; off from the start."
  label_gk_gui_stuff_warning: "Warning"
  text_gk_gui_stuff_lpe_warning: "To show the preview the server fetches the external page. The external site then sees that the link is here and when it was read, and a page can be made to count or recognise the fetches, although nobody has clicked. Pictures are therefore kept on the server, so that the reader never contacts the website. Switch it on only for websites you trust."
  text_gk_gui_stuff_lpe_warning_all: "With * in the list the server fetches from every website anyone links to. Whoever can write a link can then make the server contact any website, and that website can count or recognise the fetches although nobody has clicked. A reason is needed to save."
  text_gk_gui_stuff_person_only: "Per person only"
  text_gk_gui_stuff_person_only_tip: "This setting is never forced on everyone; each person chooses."
  label_gk_gui_stuff_lpe_domains: "Fetch only from"
  text_gk_gui_stuff_lpe_domains: "one domain per line"
  text_gk_gui_stuff_lpe_domains_info: "*.example.com means every subdomain of example.com, but not example.com itself (write that on a line of its own); a line with only * allows every website. Write domains with letters outside A to Z in punycode (xn--). Internal addresses are never fetched."
  label_gk_gui_stuff_lpe_bare_links: "Also for bare links"
  text_gk_gui_stuff_lpe_bare_links_info: "Off: the preview comes only for links written with the macro. On: also for bare links, that is plain links in text, to the domains in the list."
  label_gk_gui_stuff_lpe_max_parallel: "Fetches at the same time"
  text_gk_gui_stuff_lpe_max_parallel: "at most, in the whole instance"
  label_gk_gui_stuff_lpe_domain_interval_seconds: "Wait between fetches from the same domain"
  text_gk_gui_stuff_lpe_domain_interval_seconds: "seconds"
  label_gk_gui_stuff_lpe_page_max_kb: "Largest page"
  text_gk_gui_stuff_lpe_page_max_kb: "kB"
  label_gk_gui_stuff_lpe_image_max_kb: "Largest picture"
  text_gk_gui_stuff_lpe_image_max_kb: "kB"
  label_gk_gui_stuff_lpe_timeout_seconds: "Longest wait for an answer"
  text_gk_gui_stuff_lpe_timeout_seconds: "seconds"
  label_gk_gui_stuff_lpe_queue_max: "Most in the queue"
  text_gk_gui_stuff_lpe_queue_max: "addresses"
  text_gk_gui_stuff_lpe_queue_max_info: "When the queue is full the link shows as usual, without a preview, until the queue has shrunk. A person can add at most 60 new addresses an hour; that count is kept in Rails' cache and is not counted when the cache keeps nothing (null_store, common in development), but the cap on all previews, ten times the queue and at least 1000, holds all the same."
  label_gk_gui_stuff_lpe_refresh_days: "Renew a preview that is shown after"
  text_gk_gui_stuff_lpe_refresh_days: "days"
  label_gk_gui_stuff_lpe_forget_days: "Remove a preview nobody has shown for"
  text_gk_gui_stuff_lpe_forget_days: "days"
  label_gk_gui_stuff_lpe_link_previews_dir: "Folder for the pictures"
  text_gk_gui_stuff_lpe_link_previews_dir_info: "Empty means gk/gui_stuff/link_previews in the attachments folder. The pictures never go with an export. A new folder applies to new pictures; the old ones are not moved."
  label_gk_gui_stuff_lpe_image_folder_max_mb: "Largest size of the pictures together"
  text_gk_gui_stuff_lpe_image_folder_max_mb: "MB"
  text_gk_gui_stuff_lpe_image_folder_max_mb_info: "When the pictures together reach this size, the picture is removed from the previews shown longest ago until the rest fits. The preview stays with its title and text, as a preview without a picture, and the picture is fetched again when the preview is renewed. It is checked each time a picture is stored and in the nightly thinning."
  label_gk_gui_stuff_lpe_clear: "Empty the previews"
  text_gk_gui_stuff_lpe_clear_confirm: "Every kept preview and picture is removed. The previews are fetched again when the links are shown."
  text_gk_gui_stuff_lpe_cleared: "The previews are emptied (%{count})."
  text_gk_gui_stuff_lpe_clear_question: "Remove every kept preview and picture?"
  text_gk_gui_stuff_lpe_clear_what: "Addresses with previews, in the queue or failed: %{count}; pictures: %{size}. This cannot be undone. The previews are fetched again when someone shows the link."
