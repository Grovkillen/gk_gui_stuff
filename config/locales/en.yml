  text_gk_gui_stuff_sg_where_down: "One arrow down:"
  text_gk_gui_stuff_sg_where_many: "Two up, which stack, and one down:"
  text_gk_gui_stuff_sg_where_steps: "Two made-up steps:"
  text_gk_gui_stuff_sg_where_why: "This box scrolls so that the target can lie outside what is seen. It is the only example that scrolls."
  text_gk_gui_stuff_sg_where_row: "Example: a made-up row between the targets."
  text_gk_gui_stuff_sg_where_step_one: "Example: the first step, with a text and Next in the box."
  text_gk_gui_stuff_sg_where_step_two: "Example: the last step. The box stays also when the target is seen."
  label_gk_gui_stuff_changelog_show: "Show the changelog"
  label_gk_gui_stuff_changelog_hide: "Hide the changelog"
  label_gk_gui_stuff_sg_disclosure: "Disclosure"
  label_gk_gui_stuff_sg_changelog: "Changelog"
  text_gk_gui_stuff_sg_use_disclosure: "What may stay hidden until someone wants to see it: every row of a long list, a report's details, a change log. Drawn by the server and folded without any script."
  text_gk_gui_stuff_sg_not_disclosure: "What belongs together under a heading in a role (the group stands there), and long blocks on the issue page (the fold module folds those)."
  text_gk_gui_stuff_sg_use_changelog: "A plugin's change log on its settings page, always with the same helper, so that the log looks and folds the same everywhere."
  text_gk_gui_stuff_sg_not_changelog: "Other text to fold; the disclosure stands there."
  text_gk_gui_stuff_sg_changelog_example: "Example: the versions are made up and nothing here comes from a plugin. On a plugin's settings page the frame folds the log per version."
  text_gk_gui_stuff_sg_example_changelog: |
    ## 1.02.000 (2026-03-01)

    ### Added

    * A list of made-up things to try the box with.

    ### Fixed

    * The made-up list kept its order after a save.

    ## 1.01.000 (2026-01-15)

    ### Changed

    * The made-up heading reads better on a phone.
