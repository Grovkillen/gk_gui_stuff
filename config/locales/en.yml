  text_gk_gui_stuff_sg_use_icon_button: "A well-known action with only an icon, round, with a tooltip and screen reader text: reload, close, larger, smaller, leave."
  text_gk_gui_stuff_sg_not_icon_button: "An action that needs words to be understood; that is a button with text."
  text_gk_gui_stuff_sg_use_words: "The button's text: the verb that says what happens, such as Save, Create, Apply or Submit."
  text_gk_gui_stuff_sg_not_words: "Words such as OK or Yes, which do not say what the button does."
  text_gk_gui_stuff_sg_use_admin: "What only administrators see, in the administrators' role, and the lock with Step up for what needs elevation."
  text_gk_gui_stuff_sg_not_admin: "Permissions in a project; Redmine's roles govern those."
  text_gk_gui_stuff_sg_use_reason_buttons: "An action saved with a reason, with the modes Off, Optional and Required, and what cannot be undone."
  text_gk_gui_stuff_sg_not_reason_buttons: "A reason field of its own in a form; the reason always has its own box by the button."
  text_gk_gui_stuff_sg_use_popover: "A reason, a confirmation or an explanation by a button, in a box that unfolds without moving the page."
  text_gk_gui_stuff_sg_not_popover: "The browser's own confirmation or a window of its own for the same thing."
  text_gk_gui_stuff_sg_use_mount: "A control that saves at once, a switch, round check, segment or icon toggle, with the pen for a reason and the lock for elevation."
  text_gk_gui_stuff_sg_not_mount: "Fields in a form that wait for Save."
  text_gk_gui_stuff_sg_use_rail: "The save bar is the 3 px thin line at the end of a row that saves at once. It shows the state: saves at once, changed, saved or not saved. When it has saved, Saved stands for a moment right under the control that was pressed, as Copied does; when it cannot be saved a notice says so. The switch and the other controls in the tiles are what one presses; the line is what answers. With the row Sweep towards the save bar under Appearance, a line also runs along a long row to the bar while it saves. The quick save's forms are here too."
  text_gk_gui_stuff_sg_not_rail: "A form with several fields and one Save."
  text_gk_gui_stuff_sg_use_card: "An action with a title and an explanation in a box of its own, also in the alarm role, with the unfolding box in it."
  text_gk_gui_stuff_sg_not_card: "A message without an action; that is a banner or a notice."
  text_gk_gui_stuff_sg_use_pill: "Data that can be read, filtered on or removed: tags, status and category, with a count."
  text_gk_gui_stuff_sg_not_pill: "Actions: an action is a button, a pill is data."
  text_gk_gui_stuff_sg_use_count: "A count by a name or a heading, filled in the alarm role when something waits and quiet without a role."
  text_gk_gui_stuff_sg_not_count: "Values that are not counts, such as dates or sums."
  text_gk_gui_stuff_sg_use_bars: "Counts in groups that are compared, with the bars on the same vertical line."
  text_gk_gui_stuff_sg_not_bars: "Time series and charts."
  text_gk_gui_stuff_sg_use_group: "What belongs together, with a frame and a heading in a role, and that can be folded."
  text_gk_gui_stuff_sg_not_group: "A form's fields; Redmine's boxes stand there."
  text_gk_gui_stuff_sg_use_lists: "Lists and tables: the box of choices that is remembered, the row menu for the rare actions and the filter for long lists."
  text_gk_gui_stuff_sg_not_lists: "What is done often on a row; the pen stays in the row."
  text_gk_gui_stuff_sg_use_ss: "Search and several choices in long lists, with Add for a new value created on Save."
  text_gk_gui_stuff_sg_not_ss: "Short lists with a few choices; Redmine's own list is enough there."
  text_gk_gui_stuff_sg_use_category_picker: "Choosing a category with its colour and number, four by three and None."
  text_gk_gui_stuff_sg_not_category_picker: "Free colour: a category always has one of the twelve colours."
  text_gk_gui_stuff_sg_use_form: "A form with several boxes that each have their own Save and say what is changed but not saved."
  text_gk_gui_stuff_sg_not_form: "A control that saves at once; it stands on a row with a save bar."
  text_gk_gui_stuff_sg_use_line: "The states of the statuses on a line with halves, bands, lanes and steps, in the forms detailed, compact and editable."
  text_gk_gui_stuff_sg_not_line: "A timeline with dates: the line shows states, not time."
  text_gk_gui_stuff_sg_use_sentence: "A filter or a setting as a row with a label and pills, where each part opens its own box."
  text_gk_gui_stuff_sg_not_sentence: "A form with fixed fields that always show."
  text_gk_gui_stuff_sg_use_meaning: "The choice between Meaning view and Classic view per page, with the instance's three modes."
  text_gk_gui_stuff_sg_not_meaning: "Other choices of how a page shows, such as sorting or columns."
  text_gk_gui_stuff_sg_use_layer: "A surface in the upper layer by what opened it, which moves nothing on the page."
  text_gk_gui_stuff_sg_not_layer: "What stops everything else until it is done; that is the surface in the middle."
  text_gk_gui_stuff_sg_use_elements: "The shared surfaces a script opens: the surface in the middle, the drawer, the wave, the corner fold and the palette."
  text_gk_gui_stuff_sg_not_elements: "Boxes and windows of a plugin's own; the shared ones are used."
  text_gk_gui_stuff_sg_use_messages: "Banners in the page and notices in the corner, in the alert level's role, from tip to critical."
  text_gk_gui_stuff_sg_not_messages: "A confirmation nobody needs to read; that is the whisper."
  text_gk_gui_stuff_sg_use_copy: "The whisper that confirms something was copied, short and without a cross."
  text_gk_gui_stuff_sg_not_copy: "Messages to be read or answered; those are notices."
  text_gk_gui_stuff_sg_use_top_band: "States that hold for the whole page or session, at the top: the instance's role, who is at a shared computer, a preview, an operation that runs."
  text_gk_gui_stuff_sg_not_top_band: "What should be a little in the way, such as elevation; that stands in the corner ribbon."
  text_gk_gui_stuff_sg_use_ribbon: "What should be a little in the way: elevation, seeing as and the reserve account, with a button to leave."
  text_gk_gui_stuff_sg_not_ribbon: "Calm states such as the instance's role; those stand in the top band."
  text_gk_gui_stuff_sg_use_core_forms: "Redmine's forms with labels, fields and the error box."
  text_gk_gui_stuff_sg_not_core_forms: "A form with several boxes saved one by one."
  text_gk_gui_stuff_sg_use_core_buttons: "Redmine's buttons: Save beside Cancel, Delete and the icons."
  text_gk_gui_stuff_sg_not_core_buttons: "An action that takes a reason; that is a button with a reason."
  text_gk_gui_stuff_sg_use_core_tables: "Redmine's list with groups and totals."
  text_gk_gui_stuff_sg_not_core_tables: "What is rarely done on a row; that stands in the row menu."
  text_gk_gui_stuff_sg_use_core_journals: "Redmine's history of changes and notes on a record."
  text_gk_gui_stuff_sg_not_core_journals: "A history of a plugin's own."
  text_gk_gui_stuff_sg_use_core_tabs: "Redmine's tabs, which GK uses as they are."
  text_gk_gui_stuff_sg_not_core_tabs: "Tabs of a plugin's own."
  text_gk_gui_stuff_sg_use_core_flash: "Redmine's messages at the top after a save or an error."
  text_gk_gui_stuff_sg_not_core_flash: "Messages that come without the page loading again; those are notices."
  text_gk_gui_stuff_sg_use_core_pagination: "Redmine's page numbers under a long list."
  text_gk_gui_stuff_sg_not_core_pagination: "Short lists that fit on one page."
  text_gk_gui_stuff_sg_use_core_toolbar: "Redmine's row of links at the top right, where the page's actions stand."
  text_gk_gui_stuff_sg_not_core_toolbar: "An action with only an icon; that is the icon button."
  text_gk_gui_stuff_sg_use_core_context_menu: "Redmine's menu on a right click on a row of a list."
  text_gk_gui_stuff_sg_not_core_context_menu: "The rare actions on a row of a GK list; those stand in the row menu."
  text_gk_gui_stuff_sg_use_core_tooltip: "Redmine's tips: the title and the card at the pointer."
  text_gk_gui_stuff_sg_not_core_tooltip: "A confirmation after a copy; that is the whisper."
  text_gk_gui_stuff_sg_use_core_badges: "Redmine's status badges: status, locked and private, and the progress bar."
  text_gk_gui_stuff_sg_not_core_badges: "Tags and categories; those are pills."
  text_gk_gui_stuff_sg_use_core_dialog: "Redmine's dialog, for example to add watchers."
  text_gk_gui_stuff_sg_not_core_dialog: "GK's own surfaces; they open with the shared surface in the middle."
