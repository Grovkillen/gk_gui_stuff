  text_gk_gui_stuff_mod_color_mode: "A button in the top menu that switches between light, dark and automatic with one press. It changes the same choice each person makes under My account, Appearance, and shows the sun, the moon or the sun with a half circle after the choice. The button is there only while Dark mode is Optional. Off: no button, and the choice is still reached under My account."
