  label_gk_gui_stuff_area: "the area"
  label_gk_gui_stuff_follow_area: "By the area (%{which})"
  text_gk_gui_stuff_icons: "As Redmine: as Redmine draws it. Icon and text: an icon before the text, also where Redmine has none. Icon only: the name becomes a tooltip and is read by screen readers; a button without an icon keeps its text. The default for everyone; each person may choose under My account, and the choice for a single button below comes before the area."
  label_gk_gui_stuff_page_issue: "The issue"
  label_gk_gui_stuff_page_issue_list: "The issue list"
  label_gk_gui_stuff_page_project: "The project overview"
  label_gk_gui_stuff_page_wiki_page: "Wiki page"
  label_gk_gui_stuff_page_version: "Version"
  label_gk_gui_stuff_page_other: "Other pages"
  label_gk_gui_stuff_mod_admin_groups: "Administration in groups"
  text_gk_gui_stuff_mod_admin_groups: "The rows of the administration stand under headings instead of in one straight list, both on the page Administration and in the sidebar. A heading folds its group. Which group a row belongs to is chosen under Rows of the administration."
  label_gk_gui_stuff_ag_projects: "Projects"
  label_gk_gui_stuff_ag_people: "People and permissions"
  label_gk_gui_stuff_ag_issues: "Issues and flows"
  label_gk_gui_stuff_ag_traceability: "Traceability"
  label_gk_gui_stuff_ag_appearance: "Appearance and text"
  label_gk_gui_stuff_ag_system: "System and operations"
  label_gk_gui_stuff_ag_other: "Other"
  label_gk_gui_stuff_ag_rows: "Rows of the administration"
  text_gk_gui_stuff_ag_rows: "Every row of the administration stands in a group, and the plugin that owns the row gives the default (shown in the field). Under Own group name you move the row: write one of the known groups (%{groups}) or a word of your own, which then becomes a group of its own. Several names with commas between them also work; the first is the group the row stands in. An empty field gives the default. Name is the row's word in your language; empty gives the default, and other languages are set under Translations."
  label_gk_gui_stuff_ag_row: "Row"
  label_gk_gui_stuff_ag_group_now: "Group now"
  label_gk_gui_stuff_ag_tags: "Own group name"
  label_gk_gui_stuff_ag_caption: "Name"
  gk_gui_stuff_ag_caption_settings: "Basic settings"
  label_gk_gui_stuff_features: "Functions"
  label_gk_gui_stuff_features_modules: "Interface modules (gui_stuff)"
  text_gk_gui_stuff_features: "Every plugin's functions, from the register in GK Records. A function that is off is not shown to users; its data stays. All are off in a new installation. Every change is kept with its reason."
  text_gk_gui_stuff_features_no_register: "The functions are in the register of GK Records. Without GK Records, or with a version of it that has no register, no function is listed here and all are off."
  label_gk_gui_stuff_feature_on: "On"
  label_gk_gui_stuff_feature_off: "Off"
  label_gk_gui_stuff_feature_reason: "Reason"
  button_gk_gui_stuff_feature_on: "Switch on"
  button_gk_gui_stuff_feature_off: "Switch off"
  text_gk_gui_stuff_mode_always: "Other plugins put their buttons on the issue here."
  label_gk_reason_gui_stuff_feature_switch: "Function, switch on or off"
  # Personliga sidor efter version
  label_gk_gui_stuff_personal: "My pages"
  text_gk_gui_stuff_personal_waits: "%{n} waiting for you"
  text_gk_gui_stuff_personal_waits_split: "%{own} waiting only for you, %{shared} others may also take"
  label_gk_gui_stuff_personal_count_seconds: "Counts at the name (seconds)"
  text_gk_gui_stuff_personal_count_seconds: "How long a count on a personal page (such as Waiting for me) is counted again at most once per person. The person's own change shows at once. 0: counted at every page and pulse."
  label_gk_gui_stuff_count_split: "Own and shared apart"
  text_gk_gui_stuff_count_split: "The counter at your name shows what waits only for you and what others may also take apart, for example 2+3, instead of the sum."
  gk_gui_stuff_personal: "My pages"
  label_gk_gui_stuff_count_mode: "Counters"
  label_gk_gui_stuff_count_mode_waiting: "Show when something waits"
  label_gk_gui_stuff_count_mode_zero: "Show 0 too"
  label_gk_gui_stuff_count_mode_none: "Do not show"
  text_gk_gui_stuff_count_mode: "The counts at your personal pages and the counter at your name. Do not show removes them altogether; the pages stay."
  # The person's own placement of the buttons
  label_gk_gui_stuff_my_placements: "Buttons out or in the menu"
  text_gk_gui_stuff_my_placements: "Every button the plugins put on a page stands out among the page's own links, out with its icon only, or in the three-dot menu. Here you choose for yourself; By the system setting follows what the administrator chose."
  label_gk_gui_stuff_my_placement_default: "By the system setting (%{which})"
  label_gk_gui_stuff_layout_sidebar: "Sidebar"
  label_gk_gui_stuff_layout_sidebar_after: "After the content"
  label_gk_gui_stuff_layout_sidebar_before: "Before the content"
  label_gk_gui_stuff_layout_sidebar_hidden: "Hidden"
  label_gk_gui_stuff_layout_header: "Header"
  label_gk_gui_stuff_layout_header_tall: "As usual"
  label_gk_gui_stuff_layout_header_compact: "Compact"
  label_gk_gui_stuff_mod_list_filter: "Filter long lists"
  text_gk_gui_stuff_mod_list_filter: "A list of more than 12 check boxes (a tracker's projects and custom fields, the email events, a setting with several choices) and a table of more than 12 rows (the palette, a plugin's settings) get a filter field above them. What one types hides what does not match, the field says how many of how many are shown, and Escape or the cross empties the field. A long list of check boxes stands in a box of its own that scrolls, so that it does not push the page down. What is hidden is still sent with the form. Pages with Redmine's filters (the issue list and the like) get none. Off: Redmine's lists as they are."
  label_gk_gui_stuff_mod_select_search: "Searchable chooser for long lists"
  text_gk_gui_stuff_mod_select_search: "A list of more than 15 choices, with one or several choices, gets a chooser where one types to search. Closed, it looks like the list; open, it has a search field at the top and the choices below, the chosen one marked and the searched words in bold. Several choices stand in the field as chips with a cross. The choices stand in the same order as before, and what one types narrows them. The real list stays in the form and is what is sent. The arrow keys move, Enter chooses and Escape closes. Lists in Redmine's filters and column choice are left as they are. Off: Redmine's lists."
  label_gk_gui_stuff_mod_sticky_save: "Save that follows along"
  text_gk_gui_stuff_mod_sticky_save: "On Redmine's settings (every tab and every plugin's Configure) and in forms that ask for it, a bar at the bottom of the window holds the form's Save as long as the form's own Save is below the screen. The button presses the form's own Save, so there is still only one. Notices stand above the bar. Off: only the form's own button."
  label_gk_gui_stuff_mod_settings_frame: "Configure for GK plugins"
  text_gk_gui_stuff_mod_settings_frame: "The Configure page of every GK plugin: the boxes are folded from the start (a page with a single box has it open), a search field above them finds settings by name and help text and unfolds the boxes with hits, and the change log is folded with one part per version, the latest on top and open. Nothing in the form changes. Off: the page as the plugin draws it."
  label_gk_gui_stuff_mod_attachment_sizes: "Quick sizes for attachments"
  text_gk_gui_stuff_mod_attachment_sizes: "On Redmine's settings for files, buttons for 5 MB, 20 MB, 100 MB and 1 GB stand beside the maximum attachment size and the maximum size of a download of several files. They fill in the value in Redmine's unit, kB; the field stays and takes any value. Off: only the fields."
