  text_gk_gui_stuff_sg_use_values: "Values under their labels. The mode now shows the value that holds with the earlier one struck through after it; the mode changes shows from and to with an arrow between them. A row can stand without a dot, such as the link that shows the rest."
  text_gk_gui_stuff_sg_not_values: "A comparison of two texts line by line (Redmine's own diff stands there) and values that can be changed (the form stands there)."
