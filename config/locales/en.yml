  label_gk_gui_stuff_sg_table: "Table"
  text_gk_gui_stuff_sg_use_table: "Rows with the same columns, on top of Redmine's own table: the columns are said once with name, width and place, groups are rows that fold, a row can be voided or have an error and a cell can be muted (soft and italic) or soft (upright) and kept on one line. Below 899 px every row is stacked as a small card."
